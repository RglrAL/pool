const{useState,useEffect,useCallback,useRef,useMemo}=React;

const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Smoothly animate a number from its previous value to the target (easeOutCubic).
function useCountUp(target,dur=900){
  const to=Number(target)||0;
  const[val,setVal]=useState(to);
  const fromRef=useRef(to);
  useEffect(()=>{
    if(REDUCED||fromRef.current===to){fromRef.current=to;setVal(to);return;}
    const from=fromRef.current;const start=performance.now();let raf;
    const tick=now=>{const t=Math.min(1,(now-start)/dur);const e=1-Math.pow(1-t,3);
      setVal(from+(to-from)*e);
      if(t<1)raf=requestAnimationFrame(tick);else{fromRef.current=to;setVal(to);}};
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[to,dur]);
  return val;
}
function Num({value,decimals=0,suffix=""}){const v=useCountUp(value);return<>{decimals>0?v.toFixed(decimals):Math.round(v)}{suffix}</>;}

/* ═══════════════════════════════════════
   GITHUB GIST STORAGE LAYER
   - Public gists = anyone can read (no auth)
   - Admin writes with a Personal Access Token
   - Token stays in admin's localStorage only
   ═══════════════════════════════════════ */
const GIST_FILE="tournament.json";
const TOKEN_KEY="pool-admin-token";
const REFRESH_MS=6000;

const gist={
  async create(token,data){
    const r=await fetch("https://api.github.com/gists",{method:"POST",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
      body:JSON.stringify({description:"🎱 Pool Tournament Data",public:true,
        files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
    if(!r.ok)throw new Error(`GitHub error ${r.status}`);
    return(await r.json()).id;
  },
  async load(gistId,etag){
    // Conditional request: a matching ETag returns 304 (empty, cheap, doesn't
    // count against GitHub's rate limit) so we can poll fast.
    const headers={};if(etag)headers["If-None-Match"]=etag;
    const r=await fetch(`https://api.github.com/gists/${gistId}`,{cache:"no-store",headers});
    if(r.status===304)return{notModified:true};
    if(!r.ok)throw new Error(`Could not load gist (${r.status})`);
    const newEtag=r.headers.get("ETag");
    const g=await r.json();
    return{data:JSON.parse(g.files[GIST_FILE].content),etag:newEtag};
  },
  async save(gistId,token,data){
    const r=await fetch(`https://api.github.com/gists/${gistId}`,{method:"PATCH",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
      body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
    if(!r.ok)throw new Error(`Save failed (${r.status})`);
    return true;
  }
};

/* ═══ DATA DEFAULTS & HELPERS ═══ */
const DEF={tournamentName:"Pool Tournament 2026",days:5,players:[],results:{},schedule:{},dayDates:{},dayLabels:{},matchTimes:{},playoffs:{enabled:false,size:4,seeds:[],matches:{}}};

function generateFixtures(players){
  // Sort by creation id so fixture ids stay stable no matter how the admin
  // reorders the roster — that keeps existing results/schedule mapped correctly.
  const ps=[...players].sort((a,b)=>a.id-b.id);
  const f=[];let id=0;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
    f.push({id:id++,p1:ps[i].id,p2:ps[j].id,leg:1});
    f.push({id:id++,p1:ps[j].id,p2:ps[i].id,leg:2});}
  return f;
}

function smartSchedule(players,fixtures,numDays){
  const n=players.length;if(n<2)return{};
  const arr=players.map(p=>p.id);const isOdd=n%2===1;
  if(isOdd)arr.push(null);const en=arr.length;
  const leg1=[],leg2=[];
  for(let round=0;round<en-1;round++){
    const r1=[],r2=[];
    for(let i=0;i<en/2;i++){const a=arr[i],b=arr[en-1-i];
      if(a!=null&&b!=null){r1.push([a,b]);r2.push([b,a])}}
    leg1.push(r1);leg2.push(r2);
    const last=arr.pop();arr.splice(1,0,last);}
  const all=[...leg1,...leg2];const sched={};
  const rpd=Math.ceil(all.length/numDays);
  for(let d=0;d<numDays;d++){sched[d]=[];
    for(let r=d*rpd;r<Math.min((d+1)*rpd,all.length);r++)
      for(const[p1,p2]of all[r]){const fx=fixtures.find(f=>f.p1===p1&&f.p2===p2);
        if(fx)sched[d].push(fx.id)}}
  return sched;
}

function fmtDate(iso){if(!iso)return null;const d=new Date(iso+"T12:00:00");
  const dn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const mn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const day=d.getDate();const suf=[1,21,31].includes(day)?"st":[2,22].includes(day)?"nd":[3,23].includes(day)?"rd":"th";
  return{short:`${dn[d.getDay()].slice(0,3)} ${day}${suf} ${mn[d.getMonth()].slice(0,3)}`,long:`${dn[d.getDay()]} ${day}${suf} ${mn[d.getMonth()]}`};}

function getDayLabel(data,d){const date=fmtDate(data.dayDates?.[d]);const custom=data.dayLabels?.[d];
  if(custom&&date)return{main:custom,sub:date.long};if(date)return{main:date.long,sub:null};
  if(custom)return{main:custom,sub:null};return{main:`Day ${d+1}`,sub:null};}

function getH2H(a,b,res){let aw=0,bw=0;
  for(const r of Object.values(res)){if((r.p1Id===a&&r.p2Id===b)||(r.p1Id===b&&r.p2Id===a)){if(r.winnerId===a)aw++;else if(r.winnerId===b)bw++}}
  return{aw,bw};}

function getTable(players,results){
  const t=players.map(p=>({...p,played:0,wins:0,losses:0,pts:0,form:[],fw:0,fl:0,streak:0,cs:0,st:null}));
  const arr=Object.values(results).sort((a,b)=>(a.ts||0)-(b.ts||0));
  for(const r of arr){
    const w=t.find(p=>p.id===r.winnerId);const lid=r.p1Id===r.winnerId?r.p2Id:r.p1Id;const l=t.find(p=>p.id===lid);
    if(w){w.played++;w.wins++;w.pts+=2;w.form.push("W");
      w.fw+=(r.winnerId===r.p1Id?(r.s1||0):(r.s2||0));w.fl+=(r.winnerId===r.p1Id?(r.s2||0):(r.s1||0));
      if(w.st==="W")w.cs++;else{w.st="W";w.cs=1}w.streak=Math.max(w.streak,w.cs)}
    if(l){l.played++;l.losses++;l.form.push("L");
      l.fw+=(lid===r.p1Id?(r.s1||0):(r.s2||0));l.fl+=(lid===r.p1Id?(r.s2||0):(r.s1||0));
      if(l.st==="L")l.cs++;else{l.st="L";l.cs=1}}}
  t.sort((a,b)=>{if(b.pts!==a.pts)return b.pts-a.pts;const h=getH2H(a.id,b.id,results);if(h.aw!==h.bw)return h.bw-h.aw;return(b.fw-b.fl)-(a.fw-a.fl)});
  return t;
}

function playerResults(pid,res){return Object.values(res).filter(r=>r.p1Id===pid||r.p2Id===pid).sort((a,b)=>(b.ts||0)-(a.ts||0))}

// Headline tournament stats — each one foregrounds a player photo.
function getStats(players,results){
  const t=getTable(players,results);const played=Object.values(results);
  if(t.length<2||!played.length)return null;
  const byWins=[...t].sort((a,b)=>b.wins-a.wins||b.pts-a.pts)[0];
  const byStreak=[...t].sort((a,b)=>b.streak-a.streak)[0];
  const byFrames=[...t].sort((a,b)=>b.fw-a.fw)[0];
  let big=null;for(const r of played){const m=Math.abs((r.s1||0)-(r.s2||0));if(big===null||m>big.margin)big={margin:m,r};}
  const winner=big?t.find(p=>p.id===big.r.winnerId):null;
  return{byWins,byStreak:byStreak.streak>=2?byStreak:null,byFrames,big:big&&big.margin>0?{...big,winner}:null};
}

/* ═══ PLAYOFF BRACKET ═══ */
// Standard single-elimination seed slot order so the top seeds can only meet in the final.
function seedOrder(size){if(size<=2)return[1,2];const prev=seedOrder(size/2);const res=[];for(const s of prev){res.push(s);res.push(size+1-s)}return res}
function roundName(numMatches){return numMatches===1?"Final":numMatches===2?"Semifinals":numMatches===4?"Quarterfinals":`Round of ${numMatches*2}`}
function buildBracket(po){
  if(!po||!po.enabled)return{rounds:[],champion:null};
  const size=po.size;const order=seedOrder(size);const seeds=po.seeds||[];const matches=po.matches||{};
  const numRounds=Math.log2(size);const rounds=[];
  const r0=[];for(let i=0;i<size/2;i++){const sA=order[i*2],sB=order[i*2+1];
    r0.push({id:`0-${i}`,p1:seeds[sA-1]??null,p2:seeds[sB-1]??null,seedA:sA,seedB:sB})}
  rounds.push(r0);
  for(let r=1;r<numRounds;r++){const prev=rounds[r-1],cur=[];
    for(let i=0;i<prev.length/2;i++){const a=prev[i*2],b=prev[i*2+1];
      cur.push({id:`${r}-${i}`,p1:matches[a.id]?.winnerId??null,p2:matches[b.id]?.winnerId??null})}
    rounds.push(cur)}
  const finalM=rounds[numRounds-1][0];
  return{rounds,champion:matches[finalM.id]?.winnerId??null};
}

const PAL=["#E74C3C","#3498DB","#2ECC71","#9B59B6","#E67E22","#1ABC9C","#F39C12","#E91E63","#00BCD4","#FF7043"];

/* ═══ COMPONENTS ═══ */
// Player photo is the primary identity. ring: gold/green/silver/bronze accent. dot: live indicator.
function Av({p,size=56,ring,dot}){
  const bg=PAL[Math.abs(p?.id||0)%PAL.length];
  const ringCol={gold:"#FBBF24",green:"#22C55E",silver:"#CBD5E1",bronze:"#D97706"}[ring];
  const border=ringCol?`3px solid ${ringCol}`:"3px solid rgba(255,255,255,0.14)";
  const shadow=ringCol?`0 4px 14px ${ringCol}55, 0 2px 8px rgba(0,0,0,0.4)`:"0 4px 14px rgba(0,0,0,0.45)";
  const inner=p?.image
    ? <img src={p.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
    : <div style={{width:"100%",height:"100%",background:`radial-gradient(circle at 30% 25%,${bg},${bg}99 70%,${bg}66)`,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:Math.round(size*.42),fontFamily:"var(--hd)",textShadow:"0 2px 6px rgba(0,0,0,0.4)"}}>{p?.name?.charAt(0)?.toUpperCase()||"?"}</div>;
  return<div style={{position:"relative",flexShrink:0,width:size,height:size}}>
    <div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",border,boxShadow:shadow}}>{inner}</div>
    {dot&&<span style={{position:"absolute",bottom:1,right:1,width:Math.max(10,size*0.2),height:Math.max(10,size*0.2),borderRadius:"50%",background:"#22C55E",border:"2px solid #0B1120",boxShadow:"0 0 8px rgba(34,197,94,0.7)"}}/>}
  </div>;
}

// Confetti burst for the champion moment (lib loaded from CDN; degrades gracefully offline).
function fireConfetti(){
  if(!window.confetti)return;
  const cols=["#FBBF24","#F59E0B","#22C55E","#FFFFFF","#38BDF8"];
  const end=Date.now()+1800;
  (function frame(){
    window.confetti({particleCount:6,angle:60,spread:60,startVelocity:55,origin:{x:0,y:0.6},colors:cols});
    window.confetti({particleCount:6,angle:120,spread:60,startVelocity:55,origin:{x:1,y:0.6},colors:cols});
    if(Date.now()<end)requestAnimationFrame(frame);
  })();
  window.confetti({particleCount:120,spread:90,startVelocity:45,origin:{y:0.5},colors:cols});
}

// Scannable QR for the share link (rendered client-side, nothing sent anywhere).
function QR({url,size=200}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.QRCode)return;
    ref.current.innerHTML="";
    new window.QRCode(ref.current,{text:url,width:size,height:size,colorDark:"#0B1120",colorLight:"#ffffff",correctLevel:window.QRCode.CorrectLevel.M});
  },[url,size]);
  if(!window.QRCode)return null;
  return<div ref={ref} style={{display:"inline-block",lineHeight:0,padding:14,background:"#fff",borderRadius:18,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}/>;
}

function Dots({form,size=12}){return<div style={{display:"flex",gap:5,justifyContent:"center",marginTop:4}}>{form.slice(-5).map((r,i)=><div key={i} style={{width:size,height:size,borderRadius:"50%",background:r==="W"?"#22C55E":"#EF4444",boxShadow:`0 0 6px ${r==="W"?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"}`}}/>)}</div>;}

function Badge({type}){const b={leader:{i:"👑",l:"Leader",bg:"rgba(251,191,36,0.2)",c:"#FBBF24"},streak:{i:"🔥",l:"On Fire",bg:"rgba(239,68,68,0.15)",c:"#EF4444"},spoon:{i:"🥄",l:"Last Place",bg:"rgba(148,163,184,0.15)",c:"#94A3B8"}}[type];
  if(!b)return null;return<span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:13,fontWeight:700,background:b.bg,color:b.c,padding:"4px 12px",borderRadius:20}}>{b.i} {b.l}</span>;}

function Btn({children,onClick,color="#FBBF24",bg,disabled,style:s}){
  return<button onClick={onClick} disabled={disabled} style={{padding:"16px 24px",borderRadius:14,border:"none",fontSize:16,fontWeight:700,background:bg||color,color:bg?color:"#0F172A",cursor:disabled?"default":"pointer",fontFamily:"var(--bd)",width:"100%",minHeight:52,opacity:disabled?.4:1,boxShadow:"0 2px 8px rgba(0,0,0,0.2)",...s}}>{children}</button>;}

function DH({data,d,size="large"}){const{main,sub}=getDayLabel(data,d);
  if(size==="small")return<span style={{fontSize:14,color:"#94A3B8",fontWeight:600}}>{main}</span>;

    {sub&&<div style={{fontSize:14,color:"#94A3B8",fontWeight:500,marginTop:2}}>{sub}</div>}</div>;}

function StatusBar({lastSync,saving,isAdmin}){

      :lastSync?`Updated ${new Date(lastSync).toLocaleTimeString()}`:"Loading..."}</span>
    <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:isAdmin?"#FBBF24":"#22C55E"}}/>{isAdmin?"Admin":"Live"}</span></div>;}

function Empty({i,t}){return<div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:64,marginBottom:14}}>{i}</div><p style={{fontSize:18,color:"#94A3B8",lineHeight:1.5}}>{t}</p></div>;}

/* ═══════════ SETUP SCREEN ═══════════ */
function Setup({onReady}){
  const[mode,setMode]=useState(null);
  const[token,setToken]=useState("");
  const[gistId,setGistId]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const createNew=async()=>{
    setLoading(true);setError("");
    try{
      const id=await gist.create(token,DEF);
      localStorage.setItem(TOKEN_KEY,token);
      const url=`${location.origin}${location.pathname}?gist=${id}`;
      history.replaceState(null,"",url);
      onReady(id,token);
    }catch(e){setError("Failed: "+e.message)}
    setLoading(false);
  };

  const joinExisting=async()=>{
    setLoading(true);setError("");
    try{
      let id=gistId.trim();
      if(id.includes("gist.github.com")){const parts=id.split("/");id=parts[parts.length-1]}
      if(id.includes("?gist=")){id=id.split("?gist=")[1].split("&")[0]}
      await gist.load(id);
      localStorage.setItem(TOKEN_KEY,token);
      const url=`${location.origin}${location.pathname}?gist=${id}`;
      history.replaceState(null,"",url);
      onReady(id,token||null);
    }catch(e){setError("Could not load: "+e.message)}
    setLoading(false);
  };

  return<div style={{padding:"40px 20px",textAlign:"center",maxWidth:420,margin:"0 auto"}}>
    <div style={{fontSize:72,marginBottom:16}}>🎱</div>
    <h1 style={{fontSize:32,fontWeight:400,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:2,marginBottom:8}}>Pool Tournament</h1>
    <p style={{fontSize:16,color:"#94A3B8",marginBottom:32,lineHeight:1.5}}>Live league table, fixtures & results — shared with everyone in real time.</p>

    {!mode&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Btn onClick={()=>setMode("create")}>🏆 Create New Tournament</Btn>
      <Btn onClick={()=>setMode("join")} bg="rgba(30,41,59,0.8)" color="#94A3B8">📋 I Have a Tournament Link</Btn>
      <div style={{...C,marginTop:20,textAlign:"left",padding:20}}>
        <div style={{fontSize:15,fontWeight:700,color:"#FBBF24",marginBottom:8}}>How it works</div>
        <div style={{fontSize:14,color:"#94A3B8",lineHeight:1.6}}>
          Data is stored as a JSON file on GitHub Gist — free, no database needed. The admin enters results, everyone else sees live updates. Players just open the shared link.</div></div></div>}

    {mode==="create"&&<div style={{textAlign:"left"}}>
      <button onClick={()=>setMode(null)} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#94A3B8",fontSize:15,padding:"10px 18px",borderRadius:12,cursor:"pointer",marginBottom:20,fontWeight:600,fontFamily:"var(--bd)"}}>← Back</button>
      <h2 style={{...HS,fontSize:20}}>Create Tournament</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Step 1: Get a GitHub Token</div>

        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Step 2: Paste it here</div>
        <input value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx..." type="password"
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <Btn onClick={createNew} disabled={!token.trim()||loading}>{loading?"Creating...":"Create Tournament 🎱"}</Btn></div>
      {error&&<div style={{color:"#EF4444",marginTop:12,fontSize:14}}>{error}</div>}</div>}

    {mode==="join"&&<div style={{textAlign:"left"}}>
      <button onClick={()=>setMode(null)} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#94A3B8",fontSize:15,padding:"10px 18px",borderRadius:12,cursor:"pointer",marginBottom:20,fontWeight:600,fontFamily:"var(--bd)"}}>← Back</button>
      <h2 style={{...HS,fontSize:20}}>Join Tournament</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Tournament Link or Gist ID</div>
        <p style={{fontSize:13,color:"#64748B",marginBottom:8}}>Paste the link the admin shared with you.</p>
        <input value={gistId} onChange={e=>setGistId(e.target.value)} placeholder="Link or Gist ID..."
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8,marginTop:8}}>Admin Token (optional)</div>
        <p style={{fontSize:13,color:"#64748B",marginBottom:8}}>Only if you're the admin and want to enter results on this device.</p>
        <input value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx..." type="password"
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <Btn onClick={joinExisting} disabled={!gistId.trim()||loading}>{loading?"Loading...":"Join Tournament"}</Btn></div>
      {error&&<div style={{color:"#EF4444",marginTop:12,fontSize:14}}>{error}</div>}</div>}
  </div>;
}

/* ═══════════ SCREENS (same as before, kept compact) ═══════════ */

function StatCard({label,player,value,sub,onTap}){
  return<div onClick={()=>player&&onTap(player)} style={{...C,padding:"16px 14px",minWidth:150,flexShrink:0,cursor:player?"pointer":"default",scrollSnapAlign:"start"}}>
    <div style={{fontSize:11,color:"#64748B",fontWeight:800,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>{label}</div>
    <div style={{display:"flex",alignItems:"center",gap:11}}>
      <Av p={player} size={46}/>
      <div style={{minWidth:0}}><div style={{fontSize:16,fontWeight:700,color:"#F8FAFC",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{player?.name||"—"}</div>
        <div style={{fontSize:20,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1.1}}>{value}<span style={{fontSize:12,color:"#64748B",marginLeft:5,fontFamily:"var(--bd)",fontWeight:600}}>{sub}</span></div></div></div></div>;
}

function Home({data,players,results,fixtures,gp,onNav,onTap}){
  const table=getTable(players,results);const leader=table[0];
  const totalF=fixtures.length,played=Object.keys(results).length;
  const pct=totalF?Math.round((played/totalF)*100):0;
  const sched={};for(const[day,ids]of Object.entries(data.schedule))for(const id of ids)sched[id]=parseInt(day);
  const upcoming=fixtures.filter(f=>!results[f.id]);const next=upcoming[0];
  const stats=getStats(players,results);

  if(!players.length)return<div style={{textAlign:"center",padding:"70px 24px",animation:"slideUp 0.4s"}}>
    <div style={{fontSize:80,marginBottom:18}}>🎱</div>
    <div style={{fontSize:28,fontWeight:400,color:"#F8FAFC",marginBottom:10,fontFamily:"var(--hd)",letterSpacing:1}}>Tournament Ready</div>
    <div style={{fontSize:17,color:"#94A3B8",lineHeight:1.5}}>The admin needs to add players to get started.</div></div>;

  const leagueDone=totalF>0&&played>=totalF;
  return<div style={{display:"flex",flexDirection:"column",gap:18}}>
    {leader&&leader.played>0&&<div className="press" onClick={()=>onTap(leader)} style={{...C,background:"linear-gradient(160deg,rgba(251,191,36,0.18) 0%,rgba(251,191,36,0.02) 70%)",border:"1.5px solid rgba(251,191,36,0.35)",textAlign:"center",padding:"26px 20px 24px",cursor:"pointer",animation:leagueDone?"glow 2.5s infinite":"slideUp 0.4s"}}>
      <div style={{fontSize:13,color:"#FBBF24",fontWeight:800,letterSpacing:3,textTransform:"uppercase",marginBottom:16,fontFamily:"var(--hd)"}}>{leagueDone?"🏆 League Champion 🏆":"🏆 Current Leader"}</div>
      <div style={{display:"flex",justifyContent:"center"}}><Av p={leader} size={110} ring="gold"/></div>
      <div style={{fontSize:30,fontWeight:900,color:"#F8FAFC",marginTop:14,fontFamily:"var(--hd)",letterSpacing:.5}}>{leader.name}</div>
      <div style={{fontSize:56,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1,marginTop:2}}><Num value={leader.pts}/><span style={{fontSize:18,color:"#94A3B8",marginLeft:6}}>PTS</span></div>
      <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:12,flexWrap:"wrap"}}>
        {[["Won",leader.wins,"#22C55E"],["Lost",leader.losses,"#EF4444"],["Played",leader.played,"#94A3B8"]].map(([l,v,c])=>
          <span key={l} style={{fontSize:14,fontWeight:700,color:c,background:"rgba(0,0,0,0.25)",padding:"6px 14px",borderRadius:20}}>{v} {l}</span>)}</div>
      <div style={{marginTop:6}}><Dots form={leader.form} size={14}/></div></div>}

    {next&&(()=>{const p1=gp(next.p1),p2=gp(next.p2),time=data.matchTimes?.[next.id],di=sched[next.id];
      return<div style={{...C,border:"1.5px solid rgba(34,197,94,0.3)",padding:"22px 18px",animation:"slideUp 0.45s"}}>
        <div style={{fontSize:13,color:"#22C55E",fontWeight:800,letterSpacing:3,textTransform:"uppercase",marginBottom:18,fontFamily:"var(--hd)",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          <span style={{width:9,height:9,borderRadius:"50%",background:"#22C55E",animation:"pulse 1.6s infinite",boxShadow:"0 0 10px #22C55E"}}/> Next Match</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12}}>
          <div style={{textAlign:"center",cursor:"pointer",flex:1,minWidth:0}} onClick={()=>p1&&onTap(p1)}><div style={{display:"flex",justifyContent:"center"}}><Av p={p1} size={78}/></div><div style={{fontSize:17,fontWeight:700,color:"#F8FAFC",marginTop:10,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p1?.name}</div></div>
          <div style={{fontSize:30,fontWeight:900,color:"#475569",fontFamily:"var(--hd)",flexShrink:0}}>VS</div>
          <div style={{textAlign:"center",cursor:"pointer",flex:1,minWidth:0}} onClick={()=>p2&&onTap(p2)}><div style={{display:"flex",justifyContent:"center"}}><Av p={p2} size={78}/></div><div style={{fontSize:17,fontWeight:700,color:"#F8FAFC",marginTop:10,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p2?.name}</div></div></div>
        {(time||di!==undefined)&&<div style={{textAlign:"center",marginTop:16}}><span style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:15,color:"#CBD5E1",fontWeight:600,background:"rgba(0,0,0,0.25)",padding:"8px 16px",borderRadius:20}}>{time&&<span>⏰ {time}</span>}{time&&di!==undefined&&<span style={{color:"#475569"}}>·</span>}{di!==undefined&&<DH data={data} d={di} size="small"/>}</span></div>}</div>})()}

    {totalF>0&&<div style={{...C,padding:"18px 20px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:15,color:"#94A3B8",marginBottom:10,fontWeight:600}}><span>Tournament Progress</span><span style={{color:"#FBBF24",fontFamily:"var(--hd)",fontSize:20}}><Num value={pct} suffix="%"/></span></div>
      <div style={{height:12,background:"rgba(0,0,0,0.4)",borderRadius:6,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#FBBF24,#F59E0B)",borderRadius:6,transition:"width 0.6s",boxShadow:"0 0 12px rgba(251,191,36,0.5)"}}/></div>
      <div style={{fontSize:13,color:"#64748B",marginTop:8,fontWeight:500}}>{played} of {totalF} matches played</div></div>}

    {stats&&<div><div style={{fontSize:18,fontWeight:400,color:"#94A3B8",fontFamily:"var(--hd)",letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>Tournament Stats</div>
      <div style={{display:"flex",gap:12,overflowX:"auto",paddingBottom:4,scrollSnapType:"x mandatory"}}>
        <StatCard label="Most Wins" player={stats.byWins} value={stats.byWins.wins} sub="wins" onTap={onTap}/>
        {stats.byStreak&&<StatCard label="🔥 Hot Streak" player={stats.byStreak} value={stats.byStreak.streak} sub="in a row" onTap={onTap}/>}
        <StatCard label="Frames Won" player={stats.byFrames} value={stats.byFrames.fw} sub="frames" onTap={onTap}/>
        {stats.big&&<StatCard label="Biggest Win" player={stats.big.winner} value={`+${stats.big.margin}`} sub="margin" onTap={onTap}/>}
      </div></div>}

    {table.length>0&&<div style={C}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <span style={{fontSize:20,fontWeight:400,color:"#F8FAFC",fontFamily:"var(--hd)",letterSpacing:1.5}}>STANDINGS</span>
      <button onClick={()=>onNav("table")} style={{background:"none",border:"none",color:"#FBBF24",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"var(--bd)",padding:"8px 0"}}>See All →</button></div>
      {table.slice(0,5).map((p,i)=><div key={p.id} style={{display:"flex",alignItems:"center",gap:13,padding:"12px 0",borderTop:i>0?"1px solid rgba(255,255,255,0.06)":"none",cursor:"pointer"}} onClick={()=>onTap(p)}>
        <span style={{width:26,fontSize:18,fontWeight:800,color:i===0?"#FBBF24":i<3?"#CBD5E1":"#475569",textAlign:"center",fontFamily:"var(--hd)"}}>{i+1}</span>
        <Av p={p} size={46} ring={i===0?"gold":i===1?"silver":i===2?"bronze":undefined}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:17,fontWeight:700,color:"#F8FAFC",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div><div style={{fontSize:13,color:"#64748B",marginTop:1}}>W{p.wins} · L{p.losses}</div></div>
        <div style={{fontSize:30,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)"}}>{p.pts}</div></div>)}</div>}

    {(()=>{const td=Object.keys(data.schedule).find(d=>(data.schedule[d]||[]).some(id=>!results[id]));if(td===undefined)return null;
      const ids=data.schedule[td]||[];const tdf=ids.map(id=>fixtures.find(f=>f.id===id)).filter(Boolean);
      return<div style={C}><div style={{marginBottom:14}}><DH data={data} d={parseInt(td)}/></div>
        {tdf.map((f,i)=>{const p1=gp(f.p1),p2=gp(f.p2),r=results[f.id],time=data.matchTimes?.[f.id];
          return<div key={f.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderTop:i>0?"1px solid rgba(255,255,255,0.05)":"none"}}>
            {time&&<span style={{fontSize:13,color:"#64748B",fontWeight:600,width:48,flexShrink:0}}>{time}</span>}
            <Av p={p1} size={36}/><span style={{flex:1,minWidth:0,fontSize:15,fontWeight:r?.winnerId===p1?.id?700:500,color:r?.winnerId===p1?.id?"#22C55E":"#CBD5E1",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p1?.name}</span>
            {r?<span style={{fontSize:18,fontWeight:800,color:"#FBBF24",fontFamily:"var(--hd)",padding:"0 6px"}}>{r.s1}-{r.s2}</span>:<span style={{fontSize:14,color:"#475569",fontWeight:700,padding:"0 6px"}}>vs</span>}
            <span style={{flex:1,minWidth:0,fontSize:15,textAlign:"right",fontWeight:r?.winnerId===p2?.id?700:500,color:r?.winnerId===p2?.id?"#22C55E":"#CBD5E1",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p2?.name}</span><Av p={p2} size={36}/></div>})}</div>})()}
  </div>;
}

function Podium({top,onTap}){const order=[top[1],top[0],top[2]].filter(Boolean);const rings={0:"gold",1:"silver",2:"bronze"};const sizes={0:96,1:74,2:74};
  return<div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:14,marginBottom:22,padding:"8px 0 4px"}}>
    {order.map(p=>{const rank=top.indexOf(p);const sz=sizes[rank];
      return<div key={p.id} onClick={()=>onTap(p)} style={{textAlign:"center",cursor:"pointer",flex:rank===0?"0 0 auto":"0 0 auto",animation:"popIn 0.4s"}}>
        <div style={{fontSize:rank===0?30:22,marginBottom:4}}>{rank===0?"🥇":rank===1?"🥈":"🥉"}</div>
        <div style={{display:"flex",justifyContent:"center"}}><Av p={p} size={sz} ring={rings[rank]}/></div>
        <div style={{fontSize:rank===0?17:15,fontWeight:700,color:"#F8FAFC",marginTop:8,maxWidth:96,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
        <div style={{fontSize:rank===0?30:24,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1.1}}>{p.pts}<span style={{fontSize:11,color:"#64748B",marginLeft:3}}>PTS</span></div></div>;})}</div>;}

function TableScreen({players,results,onTap}){const table=getTable(players,results);if(!players.length)return<Empty i="🏆" t="No players yet."/>;
  const podium=table.filter(p=>p.played>0).length>=3?table.slice(0,3):null;const rest=podium?table.slice(3):table;
  return<div><h2 style={HS}>LEAGUE TABLE</h2>
    {podium&&<Podium top={table.slice(0,3)} onTap={onTap}/>}
    <div className="stagger">{rest.map((p)=>{const i=table.indexOf(p);const ring=i===0?"gold":i===1?"silver":i===2?"bronze":undefined;
    return<div key={p.id} className="press" onClick={()=>onTap(p)} style={{...C,display:"flex",alignItems:"center",gap:14,padding:"15px 16px",marginBottom:10,cursor:"pointer",borderLeft:`4px solid ${i===0?"#FBBF24":i<3?"#64748B":"transparent"}`}}>
    <div style={{width:28,textAlign:"center"}}><span style={{fontSize:22,fontWeight:900,fontFamily:"var(--hd)",color:i<3?"#CBD5E1":"#475569"}}>{i+1}</span></div>
    <Av p={p} size={56} ring={ring}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:19,fontWeight:700,color:"#F8FAFC",marginBottom:5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:5}}>{i===0&&p.played>0&&<Badge type="leader"/>}{p.cs>=3&&p.st==="W"&&<Badge type="streak"/>}{i===table.length-1&&table.length>2&&p.played>0&&<Badge type="spoon"/>}</div>
      <div style={{fontSize:14,color:"#94A3B8",fontWeight:500}}>Played {p.played} · Won {p.wins} · Lost {p.losses}</div><Dots form={p.form} size={11}/></div>
    <div style={{textAlign:"right"}}><div style={{fontSize:38,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1}}>{p.pts}</div><div style={{fontSize:11,color:"#64748B",fontWeight:600,letterSpacing:1}}>PTS</div></div></div>;})}</div></div>;}

function FixturesScreen({data,players,results,fixtures,gp,onTap}){const[filter,setFilter]=useState("all");if(players.length<2)return<Empty i="📋" t="Add at least 2 players."/>;
  const sched={};for(const[day,ids]of Object.entries(data.schedule))for(const id of ids)sched[id]=parseInt(day);
  const td=Object.keys(data.schedule).find(d=>(data.schedule[d]||[]).some(id=>!results[id]));
  const filtered=fixtures.filter(f=>{if(filter==="completed")return!!results[f.id];if(filter==="upcoming")return!results[f.id];if(filter==="today")return td!==undefined&&(data.schedule[td]||[]).includes(f.id);return true});
  return<div><h2 style={HS}>FIXTURES</h2><div style={{display:"flex",gap:8,marginBottom:18,overflowX:"auto",paddingBottom:4}}>
    {["all","today","upcoming","completed"].map(f=><button key={f} onClick={()=>setFilter(f)} style={{padding:"11px 20px",borderRadius:24,border:"none",fontSize:15,fontWeight:700,background:filter===f?"#FBBF24":"rgba(255,255,255,0.06)",color:filter===f?"#0B1120":"#94A3B8",cursor:"pointer",textTransform:"capitalize",whiteSpace:"nowrap",fontFamily:"var(--bd)",minHeight:46,boxShadow:filter===f?"0 4px 14px rgba(251,191,36,0.35)":"none"}}>{f}</button>)}</div>
    <div style={{fontSize:14,color:"#64748B",marginBottom:12,fontWeight:500}}>{filtered.length} match{filtered.length!==1?"es":""}</div>
    <div className="stagger" key={filter}>{filtered.map(f=>{const p1=gp(f.p1),p2=gp(f.p2),r=results[f.id],time=data.matchTimes?.[f.id],di=sched[f.id];const w1=r?.winnerId===p1?.id,w2=r?.winnerId===p2?.id;
      return<div key={f.id} style={{...C,marginBottom:10,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,fontSize:13,fontWeight:600}}><span style={{color:"#64748B"}}>{di!==undefined&&<DH data={data} d={di} size="small"/>}{time&&` · ${time}`}</span>
          {r?<span style={{color:"#22C55E",fontWeight:700}}>✓ Complete</span>:<span style={{color:"#FBBF24",fontWeight:700}}>⏳ Upcoming</span>}</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>p1&&onTap(p1)}><Av p={p1} size={48} ring={w1?"green":undefined}/><span style={{fontSize:17,fontWeight:w1?800:500,color:w1?"#22C55E":"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p1?.name}{w1&&" 🏆"}</span></div>
          {r?<div style={{fontSize:26,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",padding:"0 8px",flexShrink:0}}>{r.s1}-{r.s2}</div>:<span style={{fontSize:18,fontWeight:800,color:"#334155",padding:"0 10px",flexShrink:0}}>VS</span>}
          <div style={{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:10,justifyContent:"flex-end",cursor:"pointer"}} onClick={()=>p2&&onTap(p2)}><span style={{fontSize:17,fontWeight:w2?800:500,color:w2?"#22C55E":"#E2E8F0",textAlign:"right",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{w2&&"🏆 "}{p2?.name}</span><Av p={p2} size={48} ring={w2?"green":undefined}/></div></div></div>})}</div></div>;}

function ScheduleScreen({data,players,results,fixtures,gp}){if(players.length<2)return<Empty i="📅" t="Add at least 2 players."/>;
  return<div><h2 style={HS}>SCHEDULE</h2>{Array.from({length:data.days},(_,d)=>{const ids=data.schedule[d]||[];const df=ids.map(id=>fixtures.find(f=>f.id===id)).filter(Boolean);
    const done=df.filter(f=>results[f.id]).length;const allDone=df.length>0&&done===df.length;
    return<div key={d} style={{...C,marginBottom:14,padding:20,borderLeft:allDone?"4px solid #22C55E":"4px solid rgba(251,191,36,0.3)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,gap:10}}><DH data={data} d={d}/>
        <span style={{fontSize:14,color:allDone?"#22C55E":"#64748B",fontWeight:600,whiteSpace:"nowrap",paddingTop:4}}>{df.length===0?"No matches":allDone?"✓ Complete":`${done}/${df.length} played`}</span></div>
      {df.map((f,i)=>{const p1=gp(f.p1),p2=gp(f.p2),r=results[f.id],time=data.matchTimes?.[f.id];
        return<div key={f.id} style={{display:"flex",alignItems:"center",gap:10,padding:"14px 0",borderTop:i>0?"1px solid rgba(255,255,255,0.05)":"none"}}>
          <span style={{fontSize:15,fontWeight:600,color:"#94A3B8",width:52,flexShrink:0}}>{time||"TBD"}</span><Av p={p1} size={40} ring={r?.winnerId===p1?.id?"green":undefined}/>
          <span style={{flex:1,minWidth:0,fontSize:16,fontWeight:r?.winnerId===p1?.id?700:500,color:r?.winnerId===p1?.id?"#22C55E":"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p1?.name}</span>
          {r?<span style={{fontSize:19,fontWeight:800,color:"#FBBF24",fontFamily:"var(--hd)"}}>{r.s1}-{r.s2}</span>:<span style={{fontSize:14,color:"#475569",fontWeight:700}}>vs</span>}
          <span style={{flex:1,minWidth:0,fontSize:16,textAlign:"right",fontWeight:r?.winnerId===p2?.id?700:500,color:r?.winnerId===p2?.id?"#22C55E":"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p2?.name}</span><Av p={p2} size={40} ring={r?.winnerId===p2?.id?"green":undefined}/></div>})}</div>})}</div>;}

function BracketMatch({m,gp,seeds}){const p1=gp(m.p1),p2=gp(m.p2);const r=m.result;
  const row=(p,score,win,seed)=><div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",opacity:p?1:.4}}>
    {p?<Av p={p} size={42} ring={win?"green":undefined}/>:<div style={{width:42,height:42,borderRadius:"50%",background:"rgba(255,255,255,0.06)",flexShrink:0}}/>}

function Profile({player,players,results,fixtures,onClose,gp}){const table=getTable(players,results);

  const pos=table.findIndex(p=>p.id===player.id)+1;const pr=playerResults(player.id,results);
  const rem=fixtures.filter(f=>(f.p1===player.id||f.p2===player.id)&&!results[f.id]);
  return<div style={{position:"fixed",inset:0,background:"#0B1120",zIndex:100,overflowY:"auto",animation:"slideUp 0.3s"}}><div style={{maxWidth:680,margin:"0 auto"}}>

      <div style={{textAlign:"center"}}><div style={{display:"flex",justifyContent:"center"}}><Av p={player} size={120} ring={pos===1&&e.played>0?"gold":undefined}/></div><h2 style={{fontSize:34,fontWeight:900,color:"#F8FAFC",margin:"16px 0 8px",fontFamily:"var(--hd)",letterSpacing:1}}>{player.name}</h2>
        <div style={{display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap"}}>{pos===1&&e.played>0&&<Badge type="leader"/>}{e.streak>=3&&<Badge type="streak"/>}</div></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginTop:20}}>
        {[["Position",pos>0?`#${pos}`:"-"],["Points",e.pts],["Played",e.played]].map(([l,v])=><div key={l} style={{...C,textAlign:"center",padding:14}}>
          <div style={{fontSize:28,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)"}}>{v}</div><div style={{fontSize:12,color:"#64748B",fontWeight:600,textTransform:"uppercase"}}>{l}</div></div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
        <div style={{...C,textAlign:"center",padding:14}}><div style={{fontSize:28,fontWeight:900,color:"#22C55E",fontFamily:"var(--hd)"}}>{e.wins}</div><div style={{fontSize:12,color:"#64748B",fontWeight:600,textTransform:"uppercase"}}>Wins</div></div>
        <div style={{...C,textAlign:"center",padding:14}}><div style={{fontSize:28,fontWeight:900,color:"#EF4444",fontFamily:"var(--hd)"}}>{e.losses}</div><div style={{fontSize:12,color:"#64748B",fontWeight:600,textTransform:"uppercase"}}>Losses</div></div></div>
      {e.form.length>0&&<div style={{marginTop:14}}><Dots form={e.form} size={14}/></div>}</div>
    <div style={{padding:"0 20px 100px"}}>
      {players.filter(p=>p.id!==player.id).some(o=>{const h=getH2H(player.id,o.id,results);return h.aw+h.bw>0})&&<>
        <h3 style={{...HS,fontSize:18,marginTop:24}}>Head-to-Head</h3>
        {players.filter(p=>p.id!==player.id).map(o=>{const h=getH2H(player.id,o.id,results);if(!h.aw&&!h.bw)return null;
          return<div key={o.id} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <Av p={o} size={40}/><span style={{flex:1,fontSize:17,color:"#E2E8F0",fontWeight:500}}>{o.name}</span>
            <span style={{fontSize:22,fontWeight:800,fontFamily:"var(--hd)",color:h.aw>h.bw?"#22C55E":h.aw<h.bw?"#EF4444":"#94A3B8"}}>{h.aw}-{h.bw}</span></div>})}</>}

      {pr.map((r,i)=>{const oid=r.p1Id===player.id?r.p2Id:r.p1Id;const o=gp(oid);const won=r.winnerId===player.id;
        return<div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
          <span style={{fontSize:22,width:28}}>{won?"✅":"❌"}</span><Av p={o} size={34}/><div style={{flex:1}}><span style={{fontSize:16,color:"#E2E8F0",fontWeight:500}}>{won?"Beat":"Lost to"} <strong>{o?.name||"?"}</strong></span></div>

function StatsScreen({players,results,onTap}){
  const table=getTable(players,results);const played=Object.values(results);
  if(!played.length)return<Empty i="📊" t="Stats will appear once matches are played."/>;
  const withGames=table.filter(p=>p.played>0);
  const diff=p=>{const d=p.fw-p.fl;return d>0?`+${d}`:`${d}`};
  // Headline records
  let big=null;for(const r of played){const m=Math.abs((r.s1||0)-(r.s2||0));if(big===null||m>big.margin)big={margin:m,r};}
  const bigWinner=big?table.find(p=>p.id===big.r.winnerId):null;
  const totalFrames=played.reduce((s,r)=>s+(r.s1||0)+(r.s2||0),0);
  return<div><h2 style={HS}>STATS</h2><div className="stagger">
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
      {[["Matches Played",played.length,"🎱"],["Frames Potted",totalFrames,"🎯"]].map(([l,v,ic])=>
        <div key={l} style={{...C,textAlign:"center",padding:"18px 12px"}}><div style={{fontSize:26}}>{ic}</div><div style={{fontSize:34,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1.1}}><Num value={v}/></div><div style={{fontSize:12,color:"#64748B",fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>{l}</div></div>)}</div>
    {big&&big.margin>0&&bigWinner&&<div className="press" onClick={()=>onTap(bigWinner)} style={{...C,marginBottom:18,padding:"16px 18px",cursor:"pointer",border:"1px solid rgba(251,191,36,0.25)"}}>
      <div style={{fontSize:16,fontWeight:800,color:"#CBD5E1",letterSpacing:1,marginBottom:10,fontFamily:"var(--hd)",textTransform:"uppercase"}}>💥 Biggest Win</div>
      <div style={{display:"flex",alignItems:"center",gap:12}}><Av p={bigWinner} size={46} ring="gold"/>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:17,fontWeight:700,color:"#F8FAFC"}}>{bigWinner.name}</div>
          <div style={{fontSize:14,color:"#94A3B8"}}>{big.r.winnerId===big.r.p1Id?`${big.r.s1}-${big.r.s2}`:`${big.r.s2}-${big.r.s1}`} · {big.margin}-frame margin</div></div></div></div>}
    <StatList label="Most Wins" icon="🏆" rank={[...table].sort((a,b)=>b.wins-a.wins||b.pts-a.pts)} val={p=>p.wins} sub="wins" onTap={onTap}/>
    <StatList label="Frames Won" icon="🎯" rank={[...table].sort((a,b)=>b.fw-a.fw)} val={p=>p.fw} sub="frames" onTap={onTap}/>
    <StatList label="Best Streak" icon="🔥" rank={[...table].sort((a,b)=>b.streak-a.streak)} val={p=>p.streak} sub="in a row" onTap={onTap}/>
    <StatList label="Frame Difference" icon="➕" rank={[...table].sort((a,b)=>(b.fw-b.fl)-(a.fw-a.fl))} val={diff} sub="diff" onTap={onTap}/>
    <StatList label="Win Rate" icon="📈" rank={[...withGames].sort((a,b)=>(b.wins/b.played)-(a.wins/a.played))} val={p=>`${Math.round((p.wins/p.played)*100)}%`} sub="" onTap={onTap}/>
  </div></div>;
}

function PlayerAdminRow({p,index,total,onRename,onImg,onRemove,onMove}){
  const[editing,setEditing]=useState(false);const[name,setName]=useState(p.name);const fileRef=useRef(null);
  useEffect(()=>{setName(p.name)},[p.name]);
  const commit=()=>{const n=name.trim();if(n&&n!==p.name)onRename(n);else setName(p.name);setEditing(false)};
  const mv={background:"rgba(255,255,255,0.07)",border:"none",borderRadius:8,color:"#94A3B8",width:32,height:24,fontSize:12,cursor:"pointer",lineHeight:1,padding:0};
  return<div style={{...C,display:"flex",alignItems:"center",gap:11,marginBottom:10,padding:"12px 14px"}}>
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <button onClick={()=>onMove(-1)} disabled={index===0} style={{...mv,opacity:index===0?.3:1}}>▲</button>
      <button onClick={()=>onMove(1)} disabled={index===total-1} style={{...mv,opacity:index===total-1?.3:1}}>▼</button></div>
    <button onClick={()=>fileRef.current?.click()} style={{padding:0,border:"none",background:"none",cursor:"pointer",position:"relative",flexShrink:0}}>
      <Av p={p} size={52}/>
      <span style={{position:"absolute",bottom:-3,right:-3,fontSize:11,background:"#0B1120",borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,0.18)"}}>📷</span></button>
    <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onImg}/>
    {editing
      ? <input autoFocus value={name} onChange={e=>setName(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setName(p.name);setEditing(false)}}} style={{...inp,flex:1,fontSize:17,padding:"10px 12px",minWidth:0}}/>
      : <span onClick={()=>setEditing(true)} style={{flex:1,minWidth:0,fontSize:18,fontWeight:600,color:"#F8FAFC",cursor:"text",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name} <span style={{fontSize:13,color:"#475569"}}>✎</span></span>}
    <button onClick={onRemove} style={{...btnS,color:"#EF4444",background:"rgba(239,68,68,0.12)",fontSize:18,minWidth:44,minHeight:44,flexShrink:0}}>✕</button></div>;
}

            {fm&&<span style={{fontSize:16,color:"#22C55E",fontWeight:600}}>{fm.long}</span>}</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <input type="date" value={dv} onChange={e=>save({...data,dayDates:{...data.dayDates,[d]:e.target.value}})} style={{...inp,fontSize:16,padding:"14px 16px",flex:1,minWidth:160,minHeight:52}}/>
            <input value={data.dayLabels?.[d]||""} onChange={e=>save({...data,dayLabels:{...data.dayLabels,[d]:e.target.value}})} placeholder="Custom label" style={{...inp,fontSize:15,padding:"14px 16px",flex:1,minWidth:160}}/></div></div>})}</div>}

    {view==="schedule"&&<div><h2 style={HS}>Schedule Fixtures</h2>
      {data.players.length>=2?<><div style={{...C,marginBottom:16,padding:16,background:"rgba(34,197,94,0.06)",border:"1px solid rgba(34,197,94,0.15)"}}>
        <p style={{fontSize:15,color:"#94A3B8",marginBottom:12,lineHeight:1.5}}>Balanced round-robin. Reverse fixtures spaced apart.</p><Btn onClick={autoS}>📅 Auto-Schedule</Btn></div>
        {Array.from({length:data.days},(_,d)=>{const ids=data.schedule[d]||[];const df=ids.map(id=>fixtures.find(f=>f.id===id)).filter(Boolean);
          return<div key={d} style={{...C,marginBottom:12,padding:18}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:10}}><div style={{flex:1}}><DH data={data} d={d}/></div>
              <span style={{fontSize:14,color:"#64748B",fontWeight:600,whiteSpace:"nowrap",paddingTop:4}}>{df.length} games</span></div>
            {df.map(f=>{const p1=gp(f.p1),p2=gp(f.p2);
              return<div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0",borderTop:"1px solid rgba(255,255,255,0.04)",fontSize:14}}>
                <input value={data.matchTimes?.[f.id]||""} onChange={e=>save({...data,matchTimes:{...data.matchTimes,[f.id]:e.target.value}})} placeholder="Time" style={{...inp,width:80,fontSize:15,padding:"12px 8px",textAlign:"center",minHeight:48}}/>
                <span style={{flex:1,color:"#E2E8F0",fontWeight:500,fontSize:15}}>{p1?.name} vs {p2?.name}</span>
                <select value={d} onChange={e=>{const ns={...data.schedule};ns[d]=(ns[d]||[]).filter(id=>id!==f.id);const to=parseInt(e.target.value);if(!ns[to])ns[to]=[];ns[to].push(f.id);save({...data,schedule:ns})}} style={{...inp,width:80,fontSize:14,padding:"12px 6px",minHeight:48}}>
                  {Array.from({length:data.days},(_,i)=><option key={i} value={i}>Day {i+1}</option>)}</select></div>})}</div>})}
      </>:<Empty i="📅" t="Add 2+ players first."/>}</div>}

    {view==="results"&&<div><h2 style={HS}>Enter Results</h2><p style={{fontSize:15,color:"#94A3B8",marginBottom:16,lineHeight:1.5}}>Enter scores and tap the winner.</p>
      {fixtures.map(f=><ResEntry key={f.id} f={f} p1={gp(f.p1)} p2={gp(f.p2)} result={data.results[f.id]} onRec={(w,s1,s2)=>recRes(f.id,w,f,s1,s2)} onClr={()=>clrRes(f.id)}/>)}</div>}

    {view==="playoffs"&&<div><h2 style={HS}>Playoffs</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:po.enabled?16:0}}>
          <span style={{fontSize:16,fontWeight:700,color:"#F8FAFC"}}>Knockout bracket</span>
          <button onClick={()=>setPo({enabled:!po.enabled})} style={{width:56,height:32,borderRadius:16,border:"none",cursor:"pointer",background:po.enabled?"#22C55E":"rgba(255,255,255,0.12)",position:"relative",flexShrink:0}}>
            <span style={{position:"absolute",top:3,left:po.enabled?27:3,width:26,height:26,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/></button></div>
        {po.enabled&&<>
          <div style={{fontSize:14,color:"#94A3B8",fontWeight:600,marginBottom:8}}>Bracket size</div>
          <div style={{display:"flex",gap:10,marginBottom:14}}>
            {[4,8].map(sz=><button key={sz} disabled={data.players.length<sz} onClick={()=>setPo({size:sz,seeds:(po.seeds||[]).slice(0,sz)})} style={{flex:1,padding:"12px",borderRadius:12,border:"none",fontSize:15,fontWeight:700,fontFamily:"var(--bd)",cursor:data.players.length<sz?"default":"pointer",opacity:data.players.length<sz?.35:1,background:po.size===sz?"#FBBF24":"rgba(30,41,59,0.8)",color:po.size===sz?"#0F172A":"#94A3B8",minHeight:48}}>Top {sz}</button>)}</div>
          <Btn onClick={autoSeed} disabled={data.players.length<po.size}>🌱 Seed from current standings</Btn>
          {(po.seeds||[]).length>0&&<div style={{marginTop:14,fontSize:13,color:"#64748B",lineHeight:1.6}}>Seeds: {(po.seeds||[]).map((id,i)=>`${i+1}. ${gp(id)?.name||"?"}`).join("   ·   ")}</div>}</>}</div>
      {po.enabled&&(po.seeds||[]).length>0&&buildBracket(po).rounds.map((rd,ri)=><div key={ri} style={{marginBottom:18}}>
        <div style={{fontSize:15,fontWeight:800,color:"#94A3B8",fontFamily:"var(--hd)",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>{roundName(rd.length)}</div>
        {rd.map(m=>(m.p1&&m.p2)
          ? <ResEntry key={m.id} f={{p1:m.p1,p2:m.p2}} p1={gp(m.p1)} p2={gp(m.p2)} result={po.matches?.[m.id]} onRec={(w,s1,s2)=>recPo(m.id,w,m,s1,s2)} onClr={()=>clrPo(m.id)}/>
          : <div key={m.id} style={{...C,marginBottom:10,padding:"16px 18px",opacity:.5,fontSize:15,color:"#64748B"}}>Awaiting previous round…</div>)}</div>)}
    </div>}

    {view==="settings"&&<div><h2 style={HS}>Settings</h2>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:8}}>Tournament Name</label>
        <input value={tn} onChange={e=>setTn(e.target.value)} style={{...inp,fontSize:17,padding:"14px 18px",width:"100%",marginBottom:10}}/><Btn onClick={()=>save({...data,tournamentName:tn})}>Save Name</Btn></div>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:8}}>Number of Days</label>
        <input type="number" min={1} max={14} value={data.days} onChange={e=>save({...data,days:parseInt(e.target.value)||1})} style={{...inp,fontSize:20,padding:"14px 18px",width:100,textAlign:"center"}}/></div>
      <div style={{...C,padding:20,border:"1px solid rgba(239,68,68,0.2)"}}><p style={{fontSize:15,color:"#94A3B8",marginBottom:14}}>Deletes everything.</p>
        <Btn onClick={()=>{if(confirm("Reset EVERYTHING?"))save(DEF)}} color="#EF4444" bg="rgba(239,68,68,0.15)">🗑️ Reset Tournament</Btn></div>
      <div style={{...C,padding:20,marginTop:14}}><p style={{fontSize:14,color:"#64748B",marginBottom:8}}>Disconnect admin from this device:</p>
        <Btn onClick={()=>{localStorage.removeItem(TOKEN_KEY);location.reload()}} bg="rgba(30,41,59,0.8)" color="#94A3B8">Log Out Admin</Btn></div></div>}
  </div>;
}

function ResEntry({f,p1,p2,result,onRec,onClr}){const[s1,setS1]=useState("");const[s2,setS2]=useState("");
  if(!p1||!p2)return null;
  if(result)return<div style={{...C,marginBottom:10,padding:"16px 18px",borderLeft:"4px solid #22C55E",opacity:.65}}>
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <Av p={p1} size={36}/><span style={{fontSize:16,fontWeight:result.winnerId===p1?.id?800:400,color:result.winnerId===p1?.id?"#22C55E":"#94A3B8"}}>{p1.name}</span>
      <span style={{fontSize:22,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)"}}>{result.s1}-{result.s2}</span>
      <span style={{fontSize:16,fontWeight:result.winnerId===p2?.id?800:400,color:result.winnerId===p2?.id?"#22C55E":"#94A3B8"}}>{p2.name}</span><Av p={p2} size={36}/>
      <button onClick={onClr} style={{...btnS,marginLeft:"auto",minHeight:44,padding:"10px 16px",fontSize:14}}>Undo</button></div></div>;
  return<div style={{...C,marginBottom:12,padding:20}}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}><Av p={p1} size={44}/><span style={{flex:1,fontSize:18,fontWeight:600,color:"#F8FAFC"}}>{p1.name}</span>
      <input value={s1} onChange={e=>setS1(e.target.value)} placeholder="0" type="number" min="0" style={{...inp,width:64,textAlign:"center",fontSize:24,fontWeight:800,padding:"12px",fontFamily:"var(--hd)"}}/></div>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}><Av p={p2} size={44}/><span style={{flex:1,fontSize:18,fontWeight:600,color:"#F8FAFC"}}>{p2.name}</span>
      <input value={s2} onChange={e=>setS2(e.target.value)} placeholder="0" type="number" min="0" style={{...inp,width:64,textAlign:"center",fontSize:24,fontWeight:800,padding:"12px",fontFamily:"var(--hd)"}}/></div>
    <div style={{display:"flex",gap:10}}>
      <button onClick={()=>{navigator.vibrate?.(20);onRec(p1.id,s1||"0",s2||"0");setS1("");setS2("")}} style={{flex:1,padding:"18px 10px",borderRadius:14,border:"none",fontSize:16,fontWeight:800,background:"rgba(34,197,94,0.15)",color:"#22C55E",cursor:"pointer",fontFamily:"var(--bd)",minHeight:56}}>{p1.name} Wins ✓</button>
      <button onClick={()=>{navigator.vibrate?.(20);onRec(p2.id,s1||"0",s2||"0");setS1("");setS2("")}} style={{flex:1,padding:"18px 10px",borderRadius:14,border:"none",fontSize:16,fontWeight:800,background:"rgba(34,197,94,0.15)",color:"#22C55E",cursor:"pointer",fontFamily:"var(--bd)",minHeight:56}}>{p2.name} Wins ✓</button></div></div>;}

/* ═══════════ MAIN APP ═══════════ */
function App(){
  const[gistId,setGistId]=useState(null);
  const[token,setToken]=useState(null);
  const[data,setData]=useState(DEF);
  const[tab,setTab]=useState("home");
  const[loading,setLoading]=useState(true);
  const[pp,setPp]=useState(null);
  const[lastSync,setLastSync]=useState(null);
  const[saving,setSaving]=useState(false);
  const[ready,setReady]=useState(false);
  const savingRef=useRef(false);   // true while a save is in flight — pause polling
  const localRevRef=useRef(0);     // newest revision we've applied locally
  const etagRef=useRef(null);      // last gist ETag, for conditional polling
  const dataRef=useRef(data);      // latest data, for diffing on poll
  const syncedRef=useRef(false);   // we've applied at least one load (suppress first-load toast)
  const leagueDoneRef=useRef(null);// null until first load; then tracks league-complete state
  const[toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  useEffect(()=>{dataRef.current=data},[data]);
  const showToast=useCallback(msg=>{setToast(msg);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToast(null),4500)},[]);

  // Check URL for gist ID on mount
  useEffect(()=>{
    const params=new URLSearchParams(location.search);
    const id=params.get("gist");
    const savedToken=localStorage.getItem(TOKEN_KEY);
    if(id){setGistId(id);setToken(savedToken);setReady(true)}
    else if(savedToken){setToken(savedToken);setReady(false)}
    else{setReady(false)}
    setLoading(false);
  },[]);

  // Load data from gist
  const loadData=useCallback(async()=>{
    if(!gistId||savingRef.current)return;        // don't clobber an in-flight save
    try{
      const res=await gist.load(gistId,etagRef.current);
      if(res.notModified)return;                  // 304 — nothing changed, cheap
      etagRef.current=res.etag;
      const d=res.data;
      const rev=d.updatedAt||0;
      if(savingRef.current)return;                // a save started while we were fetching
      if(rev<localRevRef.current)return;          // ignore stale reads that would revert us
      // Detect a brand-new result that arrived from someone else, and toast it.
      const prev=dataRef.current;
      const prevKeys=new Set(Object.keys(prev.results||{}));
      const fresh=Object.keys(d.results||{}).filter(k=>!prevKeys.has(k));
      if(syncedRef.current&&fresh.length){
        const r=fresh.map(k=>d.results[k]).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
        const nm=id=>(d.players.find(p=>p.id===id)||{}).name||"?";
        const loserId=r.p1Id===r.winnerId?r.p2Id:r.p1Id;
        const ws=r.winnerId===r.p1Id?r.s1:r.s2,ls=r.winnerId===r.p1Id?r.s2:r.s1;
        showToast(`🎱 ${nm(r.winnerId)} beat ${nm(loserId)} ${ws}-${ls}`);
      }
      if(leagueDoneRef.current===null){const tot=generateFixtures(d.players||[]).length;leagueDoneRef.current=tot>0&&Object.keys(d.results||{}).length>=tot;}
      setData({...DEF,...d});localRevRef.current=rev;setLastSync(Date.now());syncedRef.current=true;
    }catch(e){console.error("Load error:",e)}
  },[gistId,showToast]);

  useEffect(()=>{if(ready&&gistId)loadData()},[ready,gistId,loadData]);

  // Auto-refresh every 30 seconds
  useEffect(()=>{if(!ready||!gistId)return;const iv=setInterval(loadData,REFRESH_MS);return()=>clearInterval(iv)},[ready,gistId,loadData]);

  // Save to gist
  const saveData=useCallback(async(newData)=>{
    if(!gistId||!token)return;
    const stamped={...newData,updatedAt:Date.now()};  // monotonic revision marker
    savingRef.current=true;localRevRef.current=stamped.updatedAt;
    setData(stamped);setSaving(true);
    try{await gist.save(gistId,token,stamped);setLastSync(Date.now())}
    catch(e){alert("Save failed: "+e.message);console.error(e)}
    savingRef.current=false;setSaving(false);
  },[gistId,token]);

  const isAdmin=!!token;
  const fixtures=useMemo(()=>generateFixtures(data.players),[data.players]);
  const gp=useCallback(id=>data.players.find(p=>p.id===id),[data.players]);

  // Celebrate when the final league match is played (fires once, for every viewer).
  useEffect(()=>{
    if(leagueDoneRef.current===null)return;
    const total=fixtures.length,played=Object.keys(data.results).length;
    const done=total>0&&played>=total;
    if(done&&leagueDoneRef.current===false)fireConfetti();
    leagueDoneRef.current=done;
  },[data.results,fixtures.length]);

  if(loading)return<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:18}}><span style={{fontSize:56,animation:"pulse 1.2s infinite"}}>🎱</span><div className="skel" style={{width:120,height:8,borderRadius:4}}/></div>;

  if(!ready||!gistId)return<Setup onReady={(id,tok)=>{setGistId(id);setToken(tok);if(tok)localStorage.setItem(TOKEN_KEY,tok);setReady(true)}}/>;

  const tabs=[{id:"home",i:"🏠",l:"Home"},{id:"table",i:"🏆",l:"Table"},{id:"fixtures",i:"📋",l:"Fixtures"},{id:"schedule",i:"📅",l:"Schedule"},
    ...(data.playoffs?.enabled?[{id:"bracket",i:"🥊",l:"Playoffs"}]:[]),{id:"stats",i:"📊",l:"Stats"},
    ...(isAdmin?[{id:"admin",i:"⚙️",l:"Admin"}]:[])];

  return<div>
    <div style={{padding:"20px 20px 14px",background:"linear-gradient(180deg,rgba(251,191,36,0.1) 0%,transparent 100%)",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:40,backdropFilter:"blur(12px)"}}>
      <span style={{fontSize:34}}>🎱</span><h1 style={{fontSize:28,fontWeight:400,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:1.5,flex:1,lineHeight:1.05,textShadow:"0 2px 12px rgba(251,191,36,0.25)"}}>{data.tournamentName}</h1></div>

    <StatusBar lastSync={lastSync} saving={saving} isAdmin={isAdmin}/>

    {toast&&<div onClick={()=>setToast(null)} style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:200,background:"linear-gradient(135deg,#22C55E,#16A34A)",color:"#06210F",fontWeight:800,fontSize:15,padding:"13px 22px",borderRadius:16,boxShadow:"0 10px 30px rgba(0,0,0,0.5)",maxWidth:"90%",fontFamily:"var(--bd)",animation:"slideUp 0.3s",cursor:"pointer"}}>{toast}</div>}

    <div key={tab} style={{padding:"20px 16px 100px",fontFamily:"var(--bd)",animation:"fadeSlide .34s cubic-bezier(.22,1,.36,1)"}}>
      {tab==="home"&&<Home data={data} players={data.players} results={data.results} fixtures={fixtures} gp={gp} onNav={setTab} onTap={setPp}/>}
      {tab==="table"&&<TableScreen players={data.players} results={data.results} onTap={setPp}/>}
      {tab==="fixtures"&&<FixturesScreen data={data} players={data.players} results={data.results} fixtures={fixtures} gp={gp} onTap={setPp}/>}
      {tab==="schedule"&&<ScheduleScreen data={data} players={data.players} results={data.results} fixtures={fixtures} gp={gp}/>}
      {tab==="bracket"&&<BracketScreen data={data} gp={gp}/>}
      {tab==="stats"&&<StatsScreen players={data.players} results={data.results} onTap={setPp}/>}
      {tab==="admin"&&<AdminScreen data={data} save={saveData} isAdmin={isAdmin} gistId={gistId}/>}</div>

    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(8,13,25,0.92)",backdropFilter:"blur(18px)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",justifyContent:"center",zIndex:50,maxWidth:680,margin:"0 auto",paddingBottom:"env(safe-area-inset-bottom,8px)"}}>
      <div style={{position:"absolute",top:0,height:3,width:`${100/tabs.length}%`,left:`${Math.max(0,tabs.findIndex(t=>t.id===tab))*100/tabs.length}%`,background:"#FBBF24",borderRadius:"0 0 3px 3px",transition:"left .32s cubic-bezier(.22,1,.36,1)",boxShadow:"0 0 12px #FBBF24"}}/>
      {tabs.map(t=>{const on=tab===t.id;return<button key={t.id} onClick={()=>{navigator.vibrate?.(8);setTab(t.id)}} style={{flex:1,padding:"10px 0 12px",border:"none",background:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:on?"#FBBF24":"#475569",minHeight:60,transition:"color 0.25s"}}>
        <span style={{fontSize:23,filter:on?"drop-shadow(0 0 8px rgba(251,191,36,0.6))":"none",transform:on?"scale(1.14) translateY(-1px)":"scale(1)",transition:"transform 0.28s cubic-bezier(.34,1.56,.64,1)"}}>{t.i}</span><span style={{fontSize:11,fontWeight:700,fontFamily:"var(--bd)",letterSpacing:.5}}>{t.l}</span></button>;})}</div>

    {pp&&<Profile player={pp} players={data.players} results={data.results} fixtures={fixtures} onClose={()=>setPp(null)} gp={gp}/>}
  </div>;
}

const C={background:"linear-gradient(180deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02))",borderRadius:20,padding:"18px 20px",border:"1px solid rgba(255,255,255,0.08)",boxShadow:"0 8px 30px rgba(0,0,0,0.35)",backdropFilter:"blur(6px)"};
const HS={fontSize:26,fontWeight:400,color:"#F8FAFC",fontFamily:"var(--hd)",letterSpacing:2,marginBottom:16};
const inp={background:"rgba(8,13,25,0.8)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"12px 16px",color:"#F8FAFC",fontSize:16,fontFamily:"var(--bd)"};
const btnS={background:"rgba(255,255,255,0.07)",border:"none",borderRadius:12,padding:"10px 14px",color:"#94A3B8",fontSize:15,cursor:"pointer",fontFamily:"var(--bd)"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
