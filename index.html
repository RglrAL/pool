<script type="text/babel" data-type="module">
const{useState,useEffect,useCallback,useRef,useMemo,useContext}=React;
const VideoCtx=React.createContext(null); // provides playIntro(player) so any avatar can open the intro

const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═══ SOUND (synthesised via WebAudio — no asset files, opt-in) ═══ */
window.__poolSound=localStorage.getItem("pool-sound")==="1";
let _ac;
function _actx(){if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();return _ac;}
function _tone(freq,start,dur,vol=0.18,type="triangle"){const c=_actx();const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);const t=c.currentTime+start;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.03);}
function playSound(name){if(!window.__poolSound)return;try{
  if(name==="win"){_tone(660,0,0.13);_tone(880,0.08,0.18);}
  else if(name==="champ"){[523,659,784,1047].forEach((f,i)=>_tone(f,i*0.13,0.3,0.2));}
}catch(e){}}

/* ═══ SHARE-CARD COLOUR THEMES ═══ */
const CARD_THEMES={
  gold:{name:"Gold",accent:"#FBBF24",accent2:"#F59E0B",glow:"rgba(251,191,36,",bg0:"#101a33",bg1:"#0B1120",chip:"#FBBF24"},
  emerald:{name:"Emerald",accent:"#34D399",accent2:"#10B981",glow:"rgba(52,211,153,",bg0:"#0c1f1a",bg1:"#07120e",chip:"#34D399"},
  royal:{name:"Royal",accent:"#A78BFA",accent2:"#8B5CF6",glow:"rgba(167,139,250,",bg0:"#171430",bg1:"#0d0b1e",chip:"#A78BFA"},
  crimson:{name:"Crimson",accent:"#FB7185",accent2:"#F43F5E",glow:"rgba(251,113,133,",bg0:"#2a1320",bg1:"#150a11",chip:"#FB7185"}
};

// Smoothly animate a number from its previous value to the target (easeOutCubic).
function useCountUp(target,dur=900){
  const to=Number(target)||0;
  const[val,setVal]=useState(to);
  const fromRef=useRef(to);
  useEffect(()=>{
    if(REDUCED||fromRef.current===to){fromRef.current=to;setVal(to);return;}
    const from=fromRef.current;const start=performance.now();let raf;
    const tick=now=>{const t=Math.min(1,(now-start)/dur);const e=1-Math.pow(1-t,3);
      setVal(from+(to-from)*e);
      if(t<1)raf=requestAnimationFrame(tick);else{fromRef.current=to;setVal(to);}};
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[to,dur]);
  return val;
}
function Num({value,decimals=0,suffix=""}){const v=useCountUp(value);return<>{decimals>0?v.toFixed(decimals):Math.round(v)}{suffix}</>;}

/* ═══════════════════════════════════════
   GITHUB GIST STORAGE LAYER
   - Public gists = anyone can read (no auth)
   - Admin writes with a Personal Access Token
   - Token stays in admin's localStorage only
   ═══════════════════════════════════════ */
const GIST_FILE="tournament.json";
const TOKEN_KEY="pool-admin-token";
const REFRESH_MS=6000;

const gist={
  async create(token,data){
    const r=await fetch("https://api.github.com/gists",{method:"POST",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
      body:JSON.stringify({description:"🎱 Pool Tournament Data",public:true,
        files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
    if(!r.ok)throw new Error(`GitHub error ${r.status}`);
    return(await r.json()).id;
  },
  async load(gistId,etag){
    // Conditional request: a matching ETag returns 304 (empty, cheap, doesn't
    // count against GitHub's rate limit) so we can poll fast.
    const headers={};if(etag)headers["If-None-Match"]=etag;
    // Cache-bust query param defeats any edge/CDN caching that could serve a stale
    // gist (the cause of laggy/glitchy updates); ETag still validated at origin → 304s stay free.
    const r=await fetch(`https://api.github.com/gists/${gistId}?_=${Date.now()}`,{cache:"no-store",headers});
    if(r.status===304)return{notModified:true};
    if(!r.ok)throw new Error(`Could not load gist (${r.status})`);
    const newEtag=r.headers.get("ETag");
    const g=await r.json();
    return{data:JSON.parse(g.files[GIST_FILE].content),etag:newEtag};
  },
  async save(gistId,token,data){
    const r=await fetch(`https://api.github.com/gists/${gistId}`,{method:"PATCH",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
      body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(data)}}})});
    if(!r.ok)throw new Error(`Save failed (${r.status})`);
    return true;
  }
};

/* ═══ MEDIA STORAGE — commits files to a public GitHub repo, served via jsDelivr CDN.
   Needs a token with 'repo' scope. Only URLs go in the gist; binaries never do. ═══ */
const media={
  async info(repo,token){
    const r=await fetch(`https://api.github.com/repos/${repo}`,{headers:{"Authorization":`token ${token}`}});
    if(r.status===404)throw new Error("Repo not found. Create a public repo and use owner/name.");
    if(r.status===403||r.status===401)throw new Error("Token can't access repos — make a token with the 'repo' scope.");
    if(!r.ok)throw new Error(`Repo check failed (${r.status})`);
    return await r.json();
  },
  async upload(repo,token,path,base64,branch){
    const r=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:"PUT",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
      body:JSON.stringify({message:`media: ${path}`,content:base64,branch})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.message||`Upload failed (${r.status})`);
    // Pin the jsDelivr URL to the commit sha so it's immutable + instantly available.
    return `https://cdn.jsdelivr.net/gh/${repo}@${j.commit.sha}/${path}`;
  }
};
function fileToBase64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(file)})}

/* ═══ DATA DEFAULTS & HELPERS ═══ */
const DEF={tournamentName:"Pool Tournament 2026",days:5,players:[],results:{},schedule:{},dayDates:{},dayLabels:{},matchTimes:{},playoffs:{enabled:false,size:4,seeds:[],matches:{}}};

function generateFixtures(players){
  // Sort by creation id so fixture ids stay stable no matter how the admin
  // reorders the roster — that keeps existing results/schedule mapped correctly.
  const ps=[...players].sort((a,b)=>a.id-b.id);
  const f=[];let id=0;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
    f.push({id:id++,p1:ps[i].id,p2:ps[j].id,leg:1});
    f.push({id:id++,p1:ps[j].id,p2:ps[i].id,leg:2});}
  return f;
}

function smartSchedule(players,fixtures,numDays){
  const n=players.length;if(n<2)return{};
  const arr=players.map(p=>p.id);const isOdd=n%2===1;
  if(isOdd)arr.push(null);const en=arr.length;
  const leg1=[],leg2=[];
  for(let round=0;round<en-1;round++){
    const r1=[],r2=[];
    for(let i=0;i<en/2;i++){const a=arr[i],b=arr[en-1-i];
      if(a!=null&&b!=null){r1.push([a,b]);r2.push([b,a])}}
    leg1.push(r1);leg2.push(r2);
    const last=arr.pop();arr.splice(1,0,last);}
  const all=[...leg1,...leg2];const sched={};
  const rpd=Math.ceil(all.length/numDays);
  for(let d=0;d<numDays;d++){sched[d]=[];
    for(let r=d*rpd;r<Math.min((d+1)*rpd,all.length);r++)
      for(const[p1,p2]of all[r]){const fx=fixtures.find(f=>f.p1===p1&&f.p2===p2);
        if(fx)sched[d].push(fx.id)}}
  return sched;
}

function fmtDate(iso){if(!iso)return null;const d=new Date(iso+"T12:00:00");
  const dn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const mn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const day=d.getDate();const suf=[1,21,31].includes(day)?"st":[2,22].includes(day)?"nd":[3,23].includes(day)?"rd":"th";
  return{short:`${dn[d.getDay()].slice(0,3)} ${day}${suf} ${mn[d.getMonth()].slice(0,3)}`,long:`${dn[d.getDay()]} ${day}${suf} ${mn[d.getMonth()]}`};}

function getDayLabel(data,d){const date=fmtDate(data.dayDates?.[d]);const custom=data.dayLabels?.[d];
  if(custom&&date)return{main:custom,sub:date.long};if(date)return{main:date.long,sub:null};
  if(custom)return{main:custom,sub:null};return{main:`Day ${d+1}`,sub:null};}

// System-date awareness — the app knows what "today" actually is.
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function todayDayIndex(data){const t=todayISO(),dd=data.dayDates||{};for(const k in dd)if(dd[k]===t)return parseInt(k);return null;}
function nextPow2(n){let p=2;while(p<n)p*=2;return p;}

function getH2H(a,b,res){let aw=0,bw=0;
  for(const r of Object.values(res)){if((r.p1Id===a&&r.p2Id===b)||(r.p1Id===b&&r.p2Id===a)){if(r.winnerId===a)aw++;else if(r.winnerId===b)bw++}}
  return{aw,bw};}

function getTable(players,results){
  const t=players.map(p=>({...p,played:0,wins:0,losses:0,pts:0,form:[],streak:0,cs:0,st:null}));
  const arr=Object.values(results).sort((a,b)=>(a.ts||0)-(b.ts||0));
  for(const r of arr){
    const w=t.find(p=>p.id===r.winnerId);const lid=r.p1Id===r.winnerId?r.p2Id:r.p1Id;const l=t.find(p=>p.id===lid);
    if(w){w.played++;w.wins++;w.pts+=2;w.form.push("W");
      if(w.st==="W")w.cs++;else{w.st="W";w.cs=1}w.streak=Math.max(w.streak,w.cs)}
    if(l){l.played++;l.losses++;l.form.push("L");
      if(l.st==="L")l.cs++;else{l.st="L";l.cs=1}}}
  t.sort((a,b)=>{if(b.pts!==a.pts)return b.pts-a.pts;const h=getH2H(a.id,b.id,results);if(h.aw!==h.bw)return h.bw-h.aw;if(b.wins!==a.wins)return b.wins-a.wins;return a.losses-b.losses});
  return t;
}

function playerResults(pid,res){return Object.values(res).filter(r=>r.p1Id===pid||r.p2Id===pid).sort((a,b)=>(b.ts||0)-(a.ts||0))}

// Headline tournament stats — each one foregrounds a player photo.
function getStats(players,results){
  const t=getTable(players,results);const played=Object.values(results);
  if(t.length<2||!played.length)return null;
  const byWins=[...t].sort((a,b)=>b.wins-a.wins||b.pts-a.pts)[0];
  const byStreak=[...t].sort((a,b)=>b.streak-a.streak)[0];
  return{byWins,byStreak:byStreak.streak>=2?byStreak:null};
}

// Map of playerId -> rank change caused by the most recently played match.
// Stateless: compares current standings to standings minus the latest result.
function getRankDeltas(players,results){
  const all=Object.values(results);if(all.length<1)return{};
  const latestKey=Object.keys(results).reduce((a,b)=>(results[b].ts||0)>(results[a]?.ts||0)?b:a,null);
  if(latestKey===null)return{};
  const prevResults={...results};delete prevResults[latestKey];
  const now=getTable(players,results),prev=getTable(players,prevResults);
  const prevPos={};prev.forEach((p,i)=>{prevPos[p.id]=i});
  const d={};now.forEach((p,i)=>{if(prevPos[p.id]!=null)d[p.id]=prevPos[p.id]-i});
  return d;
}

/* ═══ SHAREABLE CARDS (hand-drawn on canvas — no deps, no CORS issues) ═══ */
function loadImg(src){return new Promise(res=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});}
function newCard(W,H,th){const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,th.bg0);g.addColorStop(1,th.bg1);x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,-80,40,W/2,-80,820);rg.addColorStop(0,th.glow+"0.20)");rg.addColorStop(1,th.glow+"0)");x.fillStyle=rg;x.fillRect(0,0,W,H*0.55);
  return{c,x};}
function cardTitle(x,W,title,subtitle,th,logo){
  if(logo){const h=66,w=h*(logo.width/logo.height||1);try{x.drawImage(logo,(W-w)/2,20,w,h)}catch(e){}}
  x.textAlign="center";x.fillStyle=th.accent;x.font="68px 'Bebas Neue',sans-serif";x.fillText((title||"Pool Tournament").toUpperCase(),W/2,logo?156:118);
  if(subtitle){x.fillStyle="#94A3B8";x.font="600 30px 'DM Sans',sans-serif";x.fillText(subtitle,W/2,logo?202:170);}}
function cardFooter(x,W,H){x.textAlign="center";x.fillStyle="#475569";x.font="600 26px 'DM Sans',sans-serif";x.fillText("🎱 Live tournament · shared via Pool Tournament",W/2,H-40);}
function drawAvatar(x,p,img,cx,cy,r,ringColor){
  const d=r*2,ix=cx-r,iy=cy-r;
  x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.closePath();x.clip();
  if(img){const ar=img.width/img.height;let sw=img.width,sh=img.height;if(ar>1)sw=img.height;else sh=img.width;x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,ix,iy,d,d);}
  else{const col=PAL[Math.abs(p.id||0)%PAL.length];const lg=x.createLinearGradient(ix,iy,ix+d,iy+d);lg.addColorStop(0,col);lg.addColorStop(1,col+"bb");x.fillStyle=lg;x.fillRect(ix,iy,d,d);x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.font=`${Math.round(d*0.46)}px 'Bebas Neue',sans-serif`;x.fillText((p.name||"?").charAt(0).toUpperCase(),cx,cy+2);x.textBaseline="alphabetic";}
  x.restore();
  if(ringColor){x.strokeStyle=ringColor;x.lineWidth=Math.max(4,r*0.08);x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}
}
function drawFormDots(x,form,cx,y,size){const f=form.slice(-5);const gap=size*2.0;const tw=(f.length-1)*gap;let sx=cx-tw/2;
  f.forEach(r=>{x.beginPath();x.arc(sx,y,size,0,7);x.fillStyle=r==="W"?"#22C55E":"#EF4444";x.fill();sx+=gap;});}

async function buildStandingsCard(data,results,th){
  const table=getTable(data.players,results);const top=table.slice(0,8);
  const W=1080,pad=60,rowH=134,headerH=300,footerH=96;const H=headerH+top.length*rowH+footerH;
  const{c,x}=newCard(W,H,th);
  const totalF=generateFixtures(data.players).length,played=Object.keys(results).length;const done=totalF>0&&played>=totalF;
  const logo=data.logo?await loadImg(data.logo):null;
  cardTitle(x,W,data.tournamentName,done?"🏆 FINAL STANDINGS":"LEAGUE STANDINGS",th,logo);
  const imgs=await Promise.all(top.map(p=>p.image?loadImg(p.image):Promise.resolve(null)));
  let y=headerH-78;const R=56;
  top.forEach((p,i)=>{const ry=y;const cy=ry+rowH/2-6;const ringC=i===0?th.accent:i===1?"#CBD5E1":i===2?"#D97706":null;
    if(i===0){x.fillStyle=th.glow+"0.08)";x.beginPath();x.roundRect?x.roundRect(pad-12,ry-6,W-2*(pad-12),rowH-12,18):x.rect(pad-12,ry-6,W-2*(pad-12),rowH-12);x.fill();}
    x.textAlign="center";x.fillStyle=ringC||"#64748B";x.font="56px 'Bebas Neue',sans-serif";x.fillText(`${i+1}`,pad+26,cy+18);
    drawAvatar(x,p,imgs[i],pad+78+R,cy,R,ringC);
    const nx=pad+78+R*2+30;

/* ═══ PLAYOFF BRACKET ═══ */
// Standard single-elimination seed slot order so the top seeds can only meet in the final.
function seedOrder(size){if(size<=2)return[1,2];const prev=seedOrder(size/2);const res=[];for(const s of prev){res.push(s);res.push(size+1-s)}return res}
function roundName(numMatches){return numMatches===1?"Final":numMatches===2?"Semifinals":numMatches===4?"Quarterfinals":`Round of ${numMatches*2}`}
function buildBracket(po){
  if(!po||!po.enabled)return{rounds:[],champion:null};
  const size=po.size;const order=seedOrder(size);const seeds=po.seeds||[];const matches=po.matches||{};
  const numRounds=Math.log2(size);const rounds=[];const winnerOf={};
  // Round 0: a player with no opponent (empty seed slot) gets a BYE and auto-advances.
  const r0=[];for(let i=0;i<size/2;i++){const sA=order[i*2],sB=order[i*2+1];
    const p1=seeds[sA-1]??null,p2=seeds[sB-1]??null;const id=`0-${i}`;const bye=(!!p1)!==(!!p2);
    let win=matches[id]?.winnerId??null;if(bye)win=p1||p2;
    winnerOf[id]=win;r0.push({id,p1,p2,seedA:sA,seedB:sB,bye,win})}
  rounds.push(r0);
  for(let r=1;r<numRounds;r++){const prev=rounds[r-1],cur=[];
    for(let i=0;i<prev.length/2;i++){const a=prev[i*2],b=prev[i*2+1];const id=`${r}-${i}`;
      const p1=winnerOf[a.id]??null,p2=winnerOf[b.id]??null;const win=matches[id]?.winnerId??null;
      winnerOf[id]=win;cur.push({id,p1,p2,win})}
    rounds.push(cur)}
  const finalM=rounds[numRounds-1][0];
  return{rounds,champion:winnerOf[finalM.id]??null};
}

/* ═══════════ SETUP SCREEN ═══════════ */
function Setup({onReady}){
  const[mode,setMode]=useState(null);
  const[token,setToken]=useState("");
  const[gistId,setGistId]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const createNew=async()=>{
    setLoading(true);setError("");
    try{
      const id=await gist.create(token,DEF);
      localStorage.setItem(TOKEN_KEY,token);
      const url=`${location.origin}${location.pathname}?gist=${id}`;
      history.replaceState(null,"",url);
      onReady(id,token);
    }catch(e){setError("Failed: "+e.message)}
    setLoading(false);
  };

  const joinExisting=async()=>{
    setLoading(true);setError("");
    try{
      let id=gistId.trim();
      if(id.includes("gist.github.com")){const parts=id.split("/");id=parts[parts.length-1]}
      if(id.includes("?gist=")){id=id.split("?gist=")[1].split("&")[0]}
      await gist.load(id);
      localStorage.setItem(TOKEN_KEY,token);
      const url=`${location.origin}${location.pathname}?gist=${id}`;
      history.replaceState(null,"",url);
      onReady(id,token||null);
    }catch(e){setError("Could not load: "+e.message)}
    setLoading(false);
  };

  return<div style={{padding:"40px 20px",textAlign:"center",maxWidth:420,margin:"0 auto"}}>
    <div style={{fontSize:72,marginBottom:16}}>🎱</div>
    <h1 style={{fontSize:32,fontWeight:400,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:2,marginBottom:8}}>Pool Tournament</h1>
    <p style={{fontSize:16,color:"#94A3B8",marginBottom:32,lineHeight:1.5}}>Live league table, fixtures & results — shared with everyone in real time.</p>

    {!mode&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Btn onClick={()=>setMode("create")}>🏆 Create New Tournament</Btn>
      <Btn onClick={()=>setMode("join")} bg="rgba(30,41,59,0.8)" color="#94A3B8">📋 I Have a Tournament Link</Btn>
      <div style={{...C,marginTop:20,textAlign:"left",padding:20}}>
        <div style={{fontSize:15,fontWeight:700,color:"#FBBF24",marginBottom:8}}>How it works</div>
        <div style={{fontSize:14,color:"#94A3B8",lineHeight:1.6}}>
          Data is stored as a JSON file on GitHub Gist — free, no database needed. The admin enters results, everyone else sees live updates. Players just open the shared link.</div></div></div>}

    {mode==="create"&&<div style={{textAlign:"left"}}>
      <button onClick={()=>setMode(null)} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#94A3B8",fontSize:15,padding:"10px 18px",borderRadius:12,cursor:"pointer",marginBottom:20,fontWeight:600,fontFamily:"var(--bd)"}}>← Back</button>
      <h2 style={{...HS,fontSize:20}}>Create Tournament</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Step 1: Get a GitHub Token</div>
        <ol style={{fontSize:14,color:"#94A3B8",lineHeight:1.8,paddingLeft:20}}>
          <li>Go to <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener" style={{color:"#FBBF24"}}>github.com/settings/tokens/new</a></li>
          <li>Sign in (or create a free account)</li>
          <li>Name it "Pool Tournament"</li>
          <li>Tick the <strong style={{color:"#E2E8F0"}}>"gist"</strong> checkbox only</li>
          <li>Click "Generate token" and copy it</li></ol></div>
      <div style={{...C,padding:20}}>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Step 2: Paste it here</div>
        <input value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx..." type="password"
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <Btn onClick={createNew} disabled={!token.trim()||loading}>{loading?"Creating...":"Create Tournament 🎱"}</Btn></div>
      {error&&<div style={{color:"#EF4444",marginTop:12,fontSize:14}}>{error}</div>}</div>}

    {mode==="join"&&<div style={{textAlign:"left"}}>
      <button onClick={()=>setMode(null)} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#94A3B8",fontSize:15,padding:"10px 18px",borderRadius:12,cursor:"pointer",marginBottom:20,fontWeight:600,fontFamily:"var(--bd)"}}>← Back</button>
      <h2 style={{...HS,fontSize:20}}>Join Tournament</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8}}>Tournament Link or Gist ID</div>
        <p style={{fontSize:13,color:"#64748B",marginBottom:8}}>Paste the link the admin shared with you.</p>
        <input value={gistId} onChange={e=>setGistId(e.target.value)} placeholder="Link or Gist ID..."
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <div style={{fontSize:14,fontWeight:700,color:"#FBBF24",marginBottom:8,marginTop:8}}>Admin Token (optional)</div>
        <p style={{fontSize:13,color:"#64748B",marginBottom:8}}>Only if you're the admin and want to enter results on this device.</p>
        <input value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx..." type="password"
          style={{...inp,width:"100%",fontSize:16,padding:"14px 18px",marginBottom:12}}/>
        <Btn onClick={joinExisting} disabled={!gistId.trim()||loading}>{loading?"Loading...":"Join Tournament"}</Btn></div>
      {error&&<div style={{color:"#EF4444",marginTop:12,fontSize:14}}>{error}</div>}</div>}
  </div>;
}

        <div style={{fontSize:30,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)"}}>{p.pts}</div></div>)}</div>}

    {(()=>{const rt=todayDayIndex(data);const td=rt!=null?String(rt):Object.keys(data.schedule).find(d=>(data.schedule[d]||[]).some(id=>!results[id]));if(td==null||td===undefined)return null;
      const ids=data.schedule[td]||[];const tdf=ids.map(id=>fixtures.find(f=>f.id===id)).filter(Boolean);if(!tdf.length)return null;

function Podium({top,onTap,deltas={}}){const order=[top[1],top[0],top[2]].filter(Boolean);const rings={0:"gold",1:"silver",2:"bronze"};const sizes={0:122,1:94,2:94};

// League table row that flips its avatar + flashes when the player's rank changes live.
function LeagueRow({p,i,delta,ring,onTap,total}){
  const[moved,setMoved]=useState(false);const prev=useRef(i);
  useEffect(()=>{if(prev.current!==i){setMoved(true);prev.current=i;const t=setTimeout(()=>setMoved(false),900);return()=>clearTimeout(t)}},[i]);
  return<div className="press" onClick={()=>onTap(p)} style={{...C,display:"flex",alignItems:"center",gap:14,padding:"14px 16px",marginBottom:10,cursor:"pointer",borderLeft:`4px solid ${i===0?"#FBBF24":i<3?"#64748B":"transparent"}`,animation:moved?"rankPulse .9s ease":undefined}}>
    <div style={{width:34,textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><span style={{fontSize:24,fontWeight:900,fontFamily:"var(--hd)",color:i<3?"#CBD5E1":"#475569"}}>{i+1}</span><RankDelta delta={delta} size={11}/></div>
    <Flip trigger={i}><Av p={p} size={68} ring={ring} vid/></Flip>
    <div style={{flex:1,minWidth:0}}><div style={{fontSize:20,fontWeight:700,color:"#F8FAFC",marginBottom:5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>

function TableScreen({players,results,onTap,data}){const table=getTable(players,results);if(!players.length)return<Empty i="🏆" t="No players yet."/>;
  const podium=table.filter(p=>p.played>0).length>=3?table.slice(0,3):null;const rest=podium?table.slice(3):table;
  const deltas=getRankDeltas(players,results);
  return<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <h2 style={{...HS,marginBottom:0}}>LEAGUE TABLE</h2>
      <ShareBtn data={data} results={results} opts={{mode:"standings"}}/></div>

// Horizontal bracket with exact geometry + SVG elbow connectors — reads as a real bracket, scrolls on mobile.
function BracketView({rounds,gp,onTap}){
  if(!rounds.length)return null;
  const CW=170,CH=90,CG=38,G0=20,LBL=30;
  const n0=rounds[0].length;
  const centers=rounds.map(()=>[]);
  rounds.forEach((rd,r)=>rd.forEach((m,i)=>{centers[r][i]=r===0?LBL+G0+CH/2+i*(CH+G0):(centers[r-1][2*i]+centers[r-1][2*i+1])/2;}));
  const last=rounds.length-1;const champ=rounds[last][0]?.win;const champP=champ?gp(champ):null;
  const champCol=rounds.length;            // extra column for the trophy node
  const totalW=(rounds.length+1)*CW+rounds.length*CG;
  const totalH=LBL+G0+n0*CH+(n0-1)*G0+G0;
  const xL=r=>r*(CW+CG),xR=r=>r*(CW+CG)+CW;
  const finalY=centers[last][0];
  const lines=[];
  for(let r=1;r<rounds.length;r++)for(let i=0;i<rounds[r].length;i++){
    const ay=centers[r-1][2*i],by=centers[r-1][2*i+1],ty=centers[r][i],midX=xR(r-1)+CG/2;
    lines.push(`M${xR(r-1)},${ay} H${midX} M${xR(r-1)},${by} H${midX} M${midX},${ay} V${by} M${midX},${ty} H${xL(r)}`);
  }
  lines.push(`M${xR(last)},${finalY} H${xL(champCol)}`);   // line into the champion node
  return<div style={{overflowX:"auto",paddingBottom:12,WebkitOverflowScrolling:"touch"}}>
    <div style={{position:"relative",width:totalW,height:totalH,minWidth:totalW}}>
      <svg width={totalW} height={totalH} style={{position:"absolute",top:0,left:0,pointerEvents:"none"}}>
        <path d={lines.join(" ")} fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="2" strokeLinecap="round"/></svg>
      {rounds.map((rd,r)=><div key={r} style={{position:"absolute",top:6,left:xL(r),width:CW,textAlign:"center",fontSize:12,fontWeight:800,color:"#64748B",fontFamily:"var(--hd)",letterSpacing:1.5,textTransform:"uppercase"}}>{roundName(rd.length)}</div>)}
      <div style={{position:"absolute",top:6,left:xL(champCol),width:CW,textAlign:"center",fontSize:12,fontWeight:800,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:1.5,textTransform:"uppercase"}}>Champion</div>
      {rounds.map((rd,r)=>rd.map((m,i)=><div key={m.id} style={{position:"absolute",left:xL(r),top:centers[r][i]-CH/2,width:CW,height:CH}}><BracketCell m={m} gp={gp} onTap={onTap}/></div>))}
      <div style={{position:"absolute",left:xL(champCol),top:finalY-CH/2,width:CW,height:CH}}>
        <div onClick={()=>champP&&onTap&&onTap(champP)} style={{height:"100%",borderRadius:14,border:"1.5px solid rgba(251,191,36,0.55)",background:"linear-gradient(160deg,rgba(251,191,36,0.22),rgba(251,191,36,0.04))",display:"flex",alignItems:"center",gap:10,padding:"0 12px",cursor:champP?"pointer":"default",boxShadow:"0 8px 22px rgba(251,191,36,0.18)",animation:champP?"glow 2.6s infinite":"none"}}>
          <span style={{fontSize:26,flexShrink:0}}>🏆</span>
          {champP?<Av p={champP} size={48} ring="gold"/>:<div style={{width:48,height:48,borderRadius:"50%",background:"rgba(255,255,255,0.06)",flexShrink:0}}/>}
          <span style={{flex:1,minWidth:0,fontSize:15,fontWeight:800,color:champP?"#FBBF24":"#64748B",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{champP?champP.name:"TBD"}</span></div></div>
    </div></div>;
}

// Mini line chart of a player's league position after each of their matches (rank 1 = top).
function Timeline({player,players,results}){
  const chrono=Object.values(results).filter(r=>r.ts!=null).sort((a,b)=>a.ts-b.ts);
  const sub={};let k=0;const series=[];
  for(const r of chrono){sub[k++]=r;if(r.p1Id===player.id||r.p2Id===player.id){const tbl=getTable(players,sub);series.push(tbl.findIndex(p=>p.id===player.id)+1)}}
  if(series.length<2)return null;
  const N=Math.max(2,players.length),W=320,H=120,px=16,py=18;
  const X=i=>px+i*(W-2*px)/(series.length-1);
  const Y=rank=>py+(rank-1)*(H-2*py)/(N-1);
  const line=series.map((r,i)=>`${X(i)},${Y(r)}`).join(" ");
  const area=`${X(0)},${H-py} ${line} ${X(series.length-1)},${H-py}`;
  const best=Math.min(...series),now=series[series.length-1],start=series[0];
  return<div style={{...C,marginTop:20,padding:"16px 18px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <span style={{fontSize:16,fontWeight:800,color:"#CBD5E1",letterSpacing:1,fontFamily:"var(--hd)"}}>📈 LEAGUE POSITION</span>
      <span style={{fontSize:13,color:"#64748B",fontWeight:600}}>peak #{best}</span></div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block",height:"auto"}} preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="tlg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#FBBF24" stopOpacity="0.35"/><stop offset="1" stopColor="#FBBF24" stopOpacity="0"/></linearGradient></defs>
      <polygon points={area} fill="url(#tlg)"/>
      <polyline points={line} fill="none" stroke="#FBBF24" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round"/>
      {series.map((r,i)=><circle key={i} cx={X(i)} cy={Y(r)} r={i===series.length-1?5.5:3.5} fill={i===series.length-1?"#FBBF24":"#0B1120"} stroke="#FBBF24" strokeWidth="2.5"/>)}
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#94A3B8",fontWeight:600,marginTop:6}}><span>Started #{start}</span><span style={{color:now<=start?"#22C55E":"#EF4444"}}>Now #{now}{now<start?" ▲":now>start?" ▼":""}</span></div>
  </div>;
}

        return<div key={i} onClick={()=>o&&onTap&&onTap(o)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 0",borderBottom:"1px solid rgba(255,255,255,0.05)",cursor:o?"pointer":"default"}}>
          <span style={{fontSize:22,width:28}}>{won?"✅":"❌"}</span><Av p={o} size={44}/><div style={{flex:1}}><span style={{fontSize:16,color:"#E2E8F0",fontWeight:500}}>{won?"Beat":"Lost to"} <strong>{o?.name||"?"}</strong></span></div>
</div>})}
      {rem.length>0&&<><h3 style={{...HS,fontSize:18,marginTop:24}}>Still to Play ({rem.length})</h3>
        {rem.map(f=>{const oid=f.p1===player.id?f.p2:f.p1;const o=gp(oid);
          return<div key={f.id} onClick={()=>o&&onTap&&onTap(o)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,0.05)",cursor:o?"pointer":"default"}}>
            <Av p={o} size={48}/><span style={{fontSize:17,color:"#E2E8F0",fontWeight:500}}>vs {o?.name}</span></div>})}</>}

/* ═══ STATS ═══ */
function StatList({label,icon,rank,val,sub,onTap}){

  return<div style={{...C,marginBottom:14,padding:"16px 18px"}}>
    <div style={{fontSize:16,fontWeight:800,color:"#CBD5E1",letterSpacing:1,marginBottom:10,fontFamily:"var(--hd)",display:"flex",alignItems:"center",gap:8,textTransform:"uppercase"}}><span style={{fontSize:18}}>{icon}</span>{label}</div>
    {top.map((p,i)=><div key={p.id} onClick={()=>onTap(p)} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderTop:i>0?"1px solid rgba(255,255,255,0.05)":"none",cursor:"pointer"}}>

function StatsScreen({players,results,onTap}){
  const table=getTable(players,results);const played=Object.values(results);
  if(!played.length)return<Empty i="📊" t="Stats will appear once matches are played."/>;
  const withGames=table.filter(p=>p.played>0);
  return<div><h2 style={HS}>STATS</h2><div className="stagger">
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
      {[["Matches Played",played.length,"🎱"],["Players",players.length,"👥"]].map(([l,v,ic])=>
        <div key={l} style={{...C,textAlign:"center",padding:"18px 12px"}}><div style={{fontSize:26}}>{ic}</div><div style={{fontSize:34,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)",lineHeight:1.1}}><Num value={v}/></div><div style={{fontSize:12,color:"#64748B",fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>{l}</div></div>)}</div>
    <StatList label="Most Wins" icon="🏆" rank={[...table].sort((a,b)=>b.wins-a.wins||b.pts-a.pts)} val={p=>p.wins} sub="wins" onTap={onTap}/>
    <StatList label="Best Streak" icon="🔥" rank={[...table].sort((a,b)=>b.streak-a.streak)} val={p=>p.streak} sub="in a row" onTap={onTap}/>
    <StatList label="Win Rate" icon="📈" rank={[...withGames].sort((a,b)=>(b.wins/b.played)-(a.wins/a.played))} val={p=>`${Math.round((p.wins/p.played)*100)}%`} sub="" onTap={onTap}/>
  </div></div>;
}

/* ═══ ADMIN ═══ */
function PlayerAdminRow({p,index,total,onRename,onImg,onRemove,onMove,onVideo,onVideoRemove,uploading,onSetUrl}){
  const[editing,setEditing]=useState(false);const[name,setName]=useState(p.name);const fileRef=useRef(null);const vidRef=useRef(null);
  const[exp,setExp]=useState(false);
  const[imgUrl,setImgUrl]=useState(p.image&&/^https?:/.test(p.image)?p.image:"");
  const[vidUrl,setVidUrl]=useState(p.video||"");
  useEffect(()=>{setName(p.name)},[p.name]);
  useEffect(()=>{setImgUrl(p.image&&/^https?:/.test(p.image)?p.image:"");setVidUrl(p.video||"")},[p.image,p.video]);
  const commit=()=>{const n=name.trim();if(n&&n!==p.name)onRename(n);else setName(p.name);setEditing(false)};
  const mv={background:"rgba(255,255,255,0.07)",border:"none",borderRadius:8,color:"#94A3B8",width:32,height:24,fontSize:12,cursor:"pointer",lineHeight:1,padding:0};
  const lblIn={...inp,width:"100%",fontSize:14,padding:"10px 12px"};
  return<div style={{marginBottom:10}}>
    <div style={{...C,display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:exp?"16px 16px 0 0":16}}>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        <button onClick={()=>onMove(-1)} disabled={index===0} style={{...mv,opacity:index===0?.3:1}}>▲</button>
        <button onClick={()=>onMove(1)} disabled={index===total-1} style={{...mv,opacity:index===total-1?.3:1}}>▼</button></div>
      <button onClick={()=>fileRef.current?.click()} style={{padding:0,border:"none",background:"none",cursor:"pointer",position:"relative",flexShrink:0}}>
        <Av p={p} size={52} noTap/>
        <span style={{position:"absolute",bottom:-3,right:-3,fontSize:11,background:"#0B1120",borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,0.18)"}}>📷</span></button>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onImg}/>
      {editing
        ? <input autoFocus value={name} onChange={e=>setName(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setName(p.name);setEditing(false)}}} style={{...inp,flex:1,fontSize:17,padding:"10px 12px",minWidth:0}}/>
        : <span onClick={()=>setEditing(true)} style={{flex:1,minWidth:0,fontSize:18,fontWeight:600,color:"#F8FAFC",cursor:"text",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name} <span style={{fontSize:13,color:"#475569"}}>✎</span></span>}
      <button onClick={()=>setExp(v=>!v)} title="Paste photo/video links (Cloudinary etc.)" style={{...btnS,fontSize:16,minWidth:44,minHeight:44,flexShrink:0,background:exp?"rgba(251,191,36,0.18)":"rgba(255,255,255,0.06)",color:exp?"#FBBF24":"#94A3B8"}}>🔗</button>
      <button onClick={()=>p.video?onVideoRemove():vidRef.current?.click()} disabled={uploading} title={p.video?"Remove intro video":"Upload intro video"} style={{...btnS,fontSize:16,minWidth:44,minHeight:44,flexShrink:0,background:p.video?"rgba(34,197,94,0.15)":"rgba(255,255,255,0.06)",color:p.video?"#22C55E":"#94A3B8"}}>{uploading?"⏳":p.video?"🎬✓":"🎬"}</button>
      <input ref={vidRef} type="file" accept="video/mp4,video/*" style={{display:"none"}} onChange={onVideo}/>
      <button onClick={onRemove} style={{...btnS,color:"#EF4444",background:"rgba(239,68,68,0.12)",fontSize:18,minWidth:44,minHeight:44,flexShrink:0}}>✕</button></div>
    {exp&&<div style={{...C,borderRadius:"0 0 16px 16px",borderTop:"none",marginTop:-1,padding:"14px 16px",display:"flex",flexDirection:"column",gap:12}}>
      <div><div style={{fontSize:12,color:"#94A3B8",fontWeight:700,marginBottom:6}}>📷 Photo URL (high quality)</div>
        <input value={imgUrl} onChange={e=>setImgUrl(e.target.value)} onBlur={()=>{const cur=p.image&&/^https?:/.test(p.image)?p.image:"";if(imgUrl.trim()!==cur)onSetUrl("image",imgUrl)}} onKeyDown={e=>e.key==="Enter"&&e.target.blur()} placeholder="https://res.cloudinary.com/.../photo.jpg" style={lblIn}/>
        {p.image&&!/^https?:/.test(p.image)&&!imgUrl&&<div style={{fontSize:11,color:"#64748B",marginTop:4}}>Currently using an uploaded photo — paste a URL to replace it with full quality.</div>}</div>
      <div><div style={{fontSize:12,color:"#94A3B8",fontWeight:700,marginBottom:6}}>🎬 Video URL (mp4)</div>
        <input value={vidUrl} onChange={e=>setVidUrl(e.target.value)} onBlur={()=>{if(vidUrl.trim()!==(p.video||""))onSetUrl("video",vidUrl)}} onKeyDown={e=>e.key==="Enter"&&e.target.blur()} placeholder="https://res.cloudinary.com/.../intro.mp4" style={lblIn}/></div>
      <div style={{fontSize:12,color:"#64748B",lineHeight:1.5}}>Paste a Cloudinary (or any) link. Tip: add <code style={{color:"#FBBF24"}}>f_auto,q_auto</code> after <code style={{color:"#FBBF24"}}>/upload/</code> in a Cloudinary URL for auto-optimised delivery.</div></div>}
  </div>;
}

function AdminScreen({data,save,isAdmin,gistId,onResult}){
  const[view,setView]=useState("main");const[nn,setNn]=useState("");const[tn,setTn]=useState(data.tournamentName);const logoRef=useRef(null);const[startDate,setStartDate]=useState("");
  const[uploading,setUploading]=useState(null);const[repoInput,setRepoInput]=useState(data.mediaRepo||"");const[repoStatus,setRepoStatus]=useState("");
  const handleVideo=async(pid,e)=>{const file=e.target.files[0];if(!file)return;e.target.value="";
    const repo=data.mediaRepo,token=localStorage.getItem(TOKEN_KEY);
    if(!repo){alert("Set your media repo in Settings → Player Videos first.");return}
    if(!token){alert("Admin token missing — log in as admin.");return}
    if(file.size>20*1024*1024){alert("That clip is over 20MB. jsDelivr won't serve files that big — please use a shorter/compressed mp4.");return}
    setUploading(pid);
    try{const inf=await media.info(repo,token);const b64=await fileToBase64(file);const url=await media.upload(repo,token,`videos/${pid}-${Date.now()}.mp4`,b64,inf.default_branch);
      save({...data,players:data.players.map(p=>p.id===pid?{...p,video:url}:p)});}
    catch(err){alert("Upload failed: "+err.message)}
    setUploading(null);};
  const removeVideo=pid=>save({...data,players:data.players.map(p=>p.id===pid?{...p,video:null}:p)});
  const setMediaUrl=(pid,field,url)=>{const v=url.trim();save({...data,players:data.players.map(p=>p.id===pid?{...p,[field]:v||null}:p)})};
  const connectRepo=async()=>{const repo=repoInput.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");const token=localStorage.getItem(TOKEN_KEY);if(!repo){setRepoStatus("Enter owner/repo");return}setRepoStatus("Checking…");try{const inf=await media.info(repo,token);save({...data,mediaRepo:repo});setRepoStatus(`✓ Connected · branch ${inf.default_branch}${inf.private?" · ⚠ repo is private (videos won't load for players — make it public)":""}`)}catch(e){setRepoStatus("✗ "+e.message)}};
  const setAllDates=()=>{if(!startDate)return;const dd={...data.dayDates};const base=new Date(startDate+"T12:00:00");for(let d=0;d<data.days;d++){const dt=new Date(base);dt.setDate(base.getDate()+d);dd[d]=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;}save({...data,dayDates:dd})};
  const shareUrl=`${location.origin}${location.pathname}?gist=${gistId}`;

  if(!isAdmin)return<div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:64,marginBottom:16}}>🔒</div>
    <h2 style={{...HS,textAlign:"center",fontSize:24}}>Admin Only</h2>
    <p style={{color:"#94A3B8",fontSize:16,lineHeight:1.5}}>You're viewing as a player. To manage the tournament, open this page on the admin's device (the one with the GitHub token).</p></div>;

  const fixtures=generateFixtures(data.players);const gp=id=>data.players.find(p=>p.id===id);
  const addP=()=>{if(!nn.trim())return;save({...data,players:[...data.players,{id:Date.now(),name:nn.trim(),image:null}],schedule:{}});setNn("")};
  const remP=id=>{if(!confirm("Remove player and results?"))return;const nr={...data.results};for(const k in nr)if(nr[k].p1Id===id||nr[k].p2Id===id)delete nr[k];save({...data,players:data.players.filter(p=>p.id!==id),results:nr,schedule:{}})};
  const handleImg=(pid,e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),M=140;let w=img.width,h=img.height;if(w>h){h=(h/w)*M;w=M}else{w=(w/h)*M;h=M}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);save({...data,players:data.players.map(p=>p.id===pid?{...p,image:c.toDataURL("image/jpeg",0.7)}:p)})};img.src=ev.target.result};reader.readAsDataURL(file)};
  const renameP=(id,name)=>save({...data,players:data.players.map(p=>p.id===id?{...p,name}:p)});
  const handleLogo=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),M=220;let w=img.width,h=img.height;if(w>h){h=(h/w)*M;w=M}else{w=(w/h)*M;h=M}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);save({...data,logo:c.toDataURL("image/png")})};img.src=ev.target.result};reader.readAsDataURL(file)};
  const moveP=(id,dir)=>{const arr=[...data.players];const i=arr.findIndex(p=>p.id===id);const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save({...data,players:arr})};
  const autoS=()=>{save({...data,schedule:smartSchedule(data.players,fixtures,data.days)})};
  const reveal=(wid,a,b)=>{if(!onResult)return;const lId=wid===a?b:a;onResult({winner:gp(wid),loser:gp(lId)})};
  const recRes=(fid,wid,f)=>{save({...data,results:{...data.results,[fid]:{winnerId:wid,p1Id:f.p1,p2Id:f.p2,ts:Date.now()}}});reveal(wid,f.p1,f.p2)};
  const clrRes=fid=>{const nr={...data.results};delete nr[fid];save({...data,results:nr})};
  const po=data.playoffs||DEF.playoffs;
  const setPo=patch=>save({...data,playoffs:{...po,...patch}});
  const autoSeed=()=>{const top=getTable(data.players,data.results).slice(0,po.size).map(p=>p.id);setPo({seeds:top})};
  const recPo=(mid,wid,m)=>{setPo({matches:{...po.matches,[mid]:{winnerId:wid,p1Id:m.p1,p2Id:m.p2,ts:Date.now()}}});reveal(wid,m.p1,m.p2)};
  const clrPo=mid=>{const nm={...po.matches};delete nm[mid];setPo({matches:nm})};

  return<div>
    <div style={{display:"flex",gap:6,marginBottom:20,overflowX:"auto",paddingBottom:4}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setView(t.id)} style={{padding:"12px 14px",borderRadius:12,border:"none",fontSize:13,fontWeight:700,background:view===t.id?"rgba(251,191,36,0.2)":"rgba(30,41,59,0.6)",color:view===t.id?"#FBBF24":"#64748B",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"var(--bd)",minHeight:48,display:"flex",alignItems:"center",gap:4}}>{t.i} {t.l}</button>)}</div>

    {view==="main"&&<div><h2 style={HS}>Dashboard</h2>

        {[["👥","Players",data.players.length],["📋","Fixtures",fixtures.length],["✅","Played",Object.keys(data.results).length],["⏳","Remaining",fixtures.length-Object.keys(data.results).length]].map(([ic,l,v])=>
          <div key={l} style={{...C,textAlign:"center",padding:20}}><div style={{fontSize:28}}>{ic}</div><div style={{fontSize:32,fontWeight:900,color:"#FBBF24",fontFamily:"var(--hd)"}}>{v}</div><div style={{fontSize:13,color:"#64748B",fontWeight:600}}>{l}</div></div>)}</div></div>}

    {view==="share"&&<div><h2 style={HS}>SHARE</h2>

        <div style={{background:"rgba(0,0,0,0.35)",borderRadius:12,padding:14,wordBreak:"break-all",fontSize:13,color:"#FBBF24",fontWeight:600,marginBottom:12,border:"1px solid rgba(251,191,36,0.2)"}}>{shareUrl}</div>
        <div style={{display:"flex",gap:10}}>
          <Btn onClick={()=>{navigator.clipboard?.writeText(shareUrl);alert("Link copied!")}}>📋 Copy Link</Btn>

      <div style={{...C,padding:20}}>
        <p style={{fontSize:14,color:"#64748B",lineHeight:1.6}}>Players open the link → tap Share → "Add to Home Screen" to install it as an app on their phone.</p></div></div>}

        {Array.from({length:data.days},(_,d)=>{const ids=data.schedule[d]||[];const df=ids.map(id=>fixtures.find(f=>f.id===id)).filter(Boolean);

              <span style={{fontSize:14,color:"#64748B",fontWeight:600,whiteSpace:"nowrap",paddingTop:4}}>{df.length} games</span></div>
            {df.map(f=>{const p1=gp(f.p1),p2=gp(f.p2);
              return<div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0",borderTop:"1px solid rgba(255,255,255,0.04)",fontSize:14}}>
                <input value={data.matchTimes?.[f.id]||""} onChange={e=>save({...data,matchTimes:{...data.matchTimes,[f.id]:e.target.value}})} placeholder="Time" style={{...inp,width:80,fontSize:15,padding:"12px 8px",textAlign:"center",minHeight:48}}/>
                <span style={{flex:1,color:"#E2E8F0",fontWeight:500,fontSize:15}}>{p1?.name} vs {p2?.name}</span>
                <select value={d} onChange={e=>{const ns={...data.schedule};ns[d]=(ns[d]||[]).filter(id=>id!==f.id);const to=parseInt(e.target.value);if(!ns[to])ns[to]=[];ns[to].push(f.id);save({...data,schedule:ns})}} style={{...inp,width:80,fontSize:14,padding:"12px 6px",minHeight:48}}>
                  {Array.from({length:data.days},(_,i)=><option key={i} value={i}>Day {i+1}</option>)}</select></div>})}</div>})}
      </>:<Empty i="📅" t="Add 2+ players first."/>}</div>}

    {view==="results"&&<div><h2 style={HS}>Enter Results</h2><p style={{fontSize:15,color:"#94A3B8",marginBottom:16,lineHeight:1.5}}>Enter scores and tap the winner.</p>
      {fixtures.map(f=><ResEntry key={f.id} f={f} p1={gp(f.p1)} p2={gp(f.p2)} result={data.results[f.id]} onRec={w=>recRes(f.id,w,f)} onClr={()=>clrRes(f.id)}/>)}</div>}

    {view==="playoffs"&&<div><h2 style={HS}>Playoffs</h2>
      <div style={{...C,padding:20,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:po.enabled?16:0}}>
          <span style={{fontSize:16,fontWeight:700,color:"#F8FAFC"}}>Knockout bracket</span>
          <button onClick={()=>setPo({enabled:!po.enabled})} style={{width:56,height:32,borderRadius:16,border:"none",cursor:"pointer",background:po.enabled?"#22C55E":"rgba(255,255,255,0.12)",position:"relative",flexShrink:0}}>
            <span style={{position:"absolute",top:3,left:po.enabled?27:3,width:26,height:26,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/></button></div>
        {po.enabled&&<>
          <div style={{fontSize:14,color:"#94A3B8",fontWeight:600,marginBottom:8}}>Format</div>
          {(()=>{const N=data.players.length;const seedN=(po.seeds||[]).length;const hasByes=seedN<po.size;
            const seedTop=sz=>setPo({size:sz,seeds:getTable(data.players,data.results).slice(0,sz).map(p=>p.id)});
            const seedAll=()=>{const sz=Math.min(16,Math.max(2,nextPow2(N)));setPo({size:sz,seeds:getTable(data.players,data.results).slice(0,sz).map(p=>p.id)})};
            const sb=(active,disabled)=>({flex:"1 0 auto",padding:"12px 14px",borderRadius:12,border:"none",fontSize:14,fontWeight:700,fontFamily:"var(--bd)",cursor:disabled?"default":"pointer",opacity:disabled?.35:1,background:active?"#FBBF24":"rgba(30,41,59,0.8)",color:active?"#0F172A":"#94A3B8",minHeight:48});
            return<div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              {[4,8,16].map(sz=><button key={sz} disabled={N<sz} onClick={()=>seedTop(sz)} style={sb(po.size===sz&&!hasByes,N<sz)}>Top {sz}</button>)}
              <button disabled={N<2} onClick={seedAll} style={sb(hasByes&&seedN===N,N<2)}>All {N>1?`(${N})`:""}</button></div>;})()}
          <Btn onClick={()=>setPo({seeds:getTable(data.players,data.results).slice(0,po.size).map(p=>p.id)})} disabled={data.players.length<2}>🌱 Re-seed from current standings</Btn>
          {(po.seeds||[]).length<po.size&&(po.seeds||[]).length>0&&<div style={{marginTop:10,fontSize:13,color:"#FBBF24",fontWeight:600}}>Top {po.size-(po.seeds||[]).length} seed{po.size-(po.seeds||[]).length!==1?"s":""} get a first-round bye.</div>}
          {(po.seeds||[]).length>0&&<div style={{marginTop:12,fontSize:13,color:"#64748B",lineHeight:1.6}}>Seeds: {(po.seeds||[]).map((id,i)=>`${i+1}. ${gp(id)?.name||"?"}`).join("   ·   ")}</div>}</>}</div>
      {po.enabled&&(po.seeds||[]).length>0&&buildBracket(po).rounds.map((rd,ri)=><div key={ri} style={{marginBottom:18}}>
        <div style={{fontSize:15,fontWeight:800,color:"#94A3B8",fontFamily:"var(--hd)",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>{roundName(rd.length)}</div>
        {rd.map(m=>m.bye
          ? <div key={m.id} style={{...C,marginBottom:10,padding:"14px 18px",display:"flex",alignItems:"center",gap:12}}><Av p={gp(m.win)} size={36}/><span style={{flex:1,minWidth:0,fontSize:15,fontWeight:700,color:"#E2E8F0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{gp(m.win)?.name}</span><span style={{fontSize:12,fontWeight:800,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:1,flexShrink:0}}>BYE → ADVANCES</span></div>
          : (m.p1&&m.p2)
          ? <ResEntry key={m.id} f={{p1:m.p1,p2:m.p2}} p1={gp(m.p1)} p2={gp(m.p2)} result={po.matches?.[m.id]} onRec={w=>recPo(m.id,w,m)} onClr={()=>clrPo(m.id)}/>
          : <div key={m.id} style={{...C,marginBottom:10,padding:"16px 18px",opacity:.5,fontSize:15,color:"#64748B"}}>Awaiting previous round…</div>)}</div>)}
    </div>}

    {view==="settings"&&<div><h2 style={HS}>Settings</h2>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:8}}>Tournament Name</label>
        <input value={tn} onChange={e=>setTn(e.target.value)} style={{...inp,fontSize:17,padding:"14px 18px",width:"100%",marginBottom:10}}/><Btn onClick={()=>save({...data,tournamentName:tn})}>Save Name</Btn></div>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:10}}>Header Logo</label>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:60,height:60,borderRadius:14,background:"rgba(0,0,0,0.3)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,border:"1px solid rgba(255,255,255,0.08)"}}>{data.logo?<img src={data.logo} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}}/>:<span style={{fontSize:32}}>🎱</span>}</div>
          <Btn onClick={()=>logoRef.current?.click()} style={{flex:1,padding:"14px"}}>{data.logo?"Change Logo":"Upload Logo"}</Btn>
          {data.logo&&<button onClick={()=>save({...data,logo:null})} style={{...btnS,color:"#EF4444",background:"rgba(239,68,68,0.12)",fontSize:18,minWidth:48,minHeight:48}}>✕</button>}</div>
        <input ref={logoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleLogo}/></div>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:8}}>🎬 Player Videos — Media Repo</label>
        <p style={{fontSize:13,color:"#64748B",marginBottom:10,lineHeight:1.5}}>Intro videos are committed to a <strong style={{color:"#94A3B8"}}>public</strong> GitHub repo and served via the jsDelivr CDN. Create a public repo (e.g. <code style={{color:"#FBBF24"}}>you/pool-media</code>) and make sure your admin token has the <strong style={{color:"#94A3B8"}}>repo</strong> scope.</p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input value={repoInput} onChange={e=>setRepoInput(e.target.value)} placeholder="owner/repo" style={{...inp,fontSize:16,padding:"14px 16px",flex:1,minWidth:160,minHeight:52}}/>
          <Btn onClick={connectRepo} style={{width:"auto",padding:"14px 22px"}}>Connect</Btn></div>
        {repoStatus&&<div style={{fontSize:13,color:repoStatus[0]==="✓"?"#22C55E":repoStatus[0]==="✗"?"#EF4444":"#94A3B8",marginTop:10,fontWeight:600}}>{repoStatus}</div>}
        {data.mediaRepo&&!repoStatus&&<div style={{fontSize:13,color:"#22C55E",marginTop:10,fontWeight:600}}>✓ Using {data.mediaRepo}</div>}</div>
      <div style={{...C,padding:20,marginBottom:14}}><label style={{fontSize:14,color:"#94A3B8",fontWeight:600,display:"block",marginBottom:8}}>Number of Days</label>
        <input type="number" min={1} max={14} value={data.days} onChange={e=>save({...data,days:parseInt(e.target.value)||1})} style={{...inp,fontSize:20,padding:"14px 18px",width:100,textAlign:"center"}}/></div>
      <div style={{...C,padding:20,border:"1px solid rgba(239,68,68,0.2)"}}><p style={{fontSize:15,color:"#94A3B8",marginBottom:14}}>Deletes everything.</p>
        <Btn onClick={()=>{if(confirm("Reset EVERYTHING?"))save(DEF)}} color="#EF4444" bg="rgba(239,68,68,0.15)">🗑️ Reset Tournament</Btn></div>
      <div style={{...C,padding:20,marginTop:14}}><p style={{fontSize:14,color:"#64748B",marginBottom:8}}>Disconnect admin from this device:</p>
        <Btn onClick={()=>{localStorage.removeItem(TOKEN_KEY);location.reload()}} bg="rgba(30,41,59,0.8)" color="#94A3B8">Log Out Admin</Btn></div></div>}
  </div>;
}

function ResEntry({f,p1,p2,result,onRec,onClr}){
  if(!p1||!p2)return null;
  if(result){const w1=result.winnerId===p1?.id,w2=result.winnerId===p2?.id;
    return<div style={{...C,marginBottom:10,padding:"14px 16px",borderLeft:"4px solid #22C55E"}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <Av p={p1} size={36} ring={w1?"green":undefined}/><span style={{fontSize:16,fontWeight:w1?800:400,color:w1?"#22C55E":"#64748B"}}>{p1.name}{w1&&" 🏆"}</span>
      <span style={{fontSize:13,color:"#475569",fontWeight:700,padding:"0 4px"}}>def.</span>
      <span style={{flex:1,minWidth:0,fontSize:16,fontWeight:w2?800:400,color:w2?"#22C55E":"#64748B",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{w2&&"🏆 "}{p2.name}</span><Av p={p2} size={36} ring={w2?"green":undefined}/>
      <button onClick={onClr} style={{...btnS,marginLeft:"auto",minHeight:44,padding:"10px 16px",fontSize:14}}>Undo</button></div></div>;}
  return<div style={{...C,marginBottom:12,padding:"16px 18px"}}>
    <div style={{fontSize:13,color:"#64748B",fontWeight:600,marginBottom:12,textAlign:"center"}}>Who won?</div>
    <div style={{display:"flex",gap:10}}>
      {[p1,p2].map(p=><button key={p.id} onClick={()=>{navigator.vibrate?.(20);onRec(p.id)}} style={{flex:1,padding:"14px 10px",borderRadius:14,border:"1px solid rgba(34,197,94,0.25)",fontSize:16,fontWeight:800,background:"rgba(34,197,94,0.12)",color:"#22C55E",cursor:"pointer",fontFamily:"var(--bd)",minHeight:64,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><Av p={p} size={56} noTap/><span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}}>{p.name}</span></button>)}</div></div>;}

/* ═══════════ MAIN APP ═══════════ */
function App(){
  const[gistId,setGistId]=useState(null);
  const[token,setToken]=useState(null);
  const[data,setData]=useState(DEF);
  const[tab,setTab]=useState("home");
  const[loading,setLoading]=useState(true);
  const[pp,setPp]=useState(null);
  const[lastSync,setLastSync]=useState(null);
  const[saving,setSaving]=useState(false);
  const[ready,setReady]=useState(false);
  const savingRef=useRef(false);   // true while a save is in flight — pause polling
  const localRevRef=useRef(0);     // newest revision we've applied locally
  const etagRef=useRef(null);      // last gist ETag, for conditional polling
  const dataRef=useRef(data);      // latest data, for diffing on poll
  const syncedRef=useRef(false);   // we've applied at least one load (suppress first-load toast)
  const leagueDoneRef=useRef(null);// null until first load; then tracks league-complete state
  const[toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  const[reveal,setReveal]=useState(null);
  const[intro,setIntro]=useState(null);
  const[sound,setSound]=useState(window.__poolSound);
  const toggleSound=()=>{const v=!window.__poolSound;window.__poolSound=v;localStorage.setItem("pool-sound",v?"1":"0");setSound(v);if(v){try{_actx().resume&&_actx().resume();playSound("win")}catch(e){}}};
  useEffect(()=>{dataRef.current=data},[data]);
  const showToast=useCallback(msg=>{setToast(msg);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToast(null),4500)},[]);

  // Check URL for gist ID on mount
  useEffect(()=>{
    const params=new URLSearchParams(location.search);
    const id=params.get("gist");
    const savedToken=localStorage.getItem(TOKEN_KEY);
    if(id){setGistId(id);setToken(savedToken);setReady(true)}
    else if(savedToken){setToken(savedToken);setReady(false)}
    else{setReady(false)}
    setLoading(false);
  },[]);

  // Load data from gist
  const loadData=useCallback(async()=>{
    if(!gistId||savingRef.current)return;        // don't clobber an in-flight save
    try{
      const res=await gist.load(gistId,etagRef.current);
      if(res.notModified)return;                  // 304 — nothing changed, cheap
      etagRef.current=res.etag;
      const d=res.data;
      const rev=d.updatedAt||0;
      if(savingRef.current)return;                // a save started while we were fetching
      if(rev<localRevRef.current)return;          // ignore stale reads that would revert us
      // A brand-new result arrived from someone else (live) — give viewers the reveal too.
      const prev=dataRef.current;
      const prevKeys=new Set(Object.keys(prev.results||{}));
      const fresh=Object.keys(d.results||{}).filter(k=>!prevKeys.has(k));
      if(syncedRef.current&&fresh.length){
        const r=fresh.map(k=>d.results[k]).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
        const loserId=r.p1Id===r.winnerId?r.p2Id:r.p1Id;
        setReveal({winner:d.players.find(p=>p.id===r.winnerId),loser:d.players.find(p=>p.id===loserId)});
      }
      if(leagueDoneRef.current===null){const tot=generateFixtures(d.players||[]).length;leagueDoneRef.current=tot>0&&Object.keys(d.results||{}).length>=tot;}
      setData({...DEF,...d});localRevRef.current=rev;setLastSync(Date.now());syncedRef.current=true;
    }catch(e){console.error("Load error:",e)}
  },[gistId,showToast]);

  useEffect(()=>{if(ready&&gistId)loadData()},[ready,gistId,loadData]);

  // Auto-refresh every 30 seconds
  useEffect(()=>{if(!ready||!gistId)return;const iv=setInterval(loadData,REFRESH_MS);return()=>clearInterval(iv)},[ready,gistId,loadData]);

  // Save to gist
  const saveData=useCallback(async(newData)=>{
    if(!gistId||!token)return;
    const stamped={...newData,updatedAt:Date.now()};  // monotonic revision marker
    savingRef.current=true;localRevRef.current=stamped.updatedAt;
    setData(stamped);setSaving(true);
    try{await gist.save(gistId,token,stamped);setLastSync(Date.now())}
    catch(e){alert("Save failed: "+e.message);console.error(e)}
    savingRef.current=false;setSaving(false);
  },[gistId,token]);

  const isAdmin=!!token;
  const fixtures=useMemo(()=>generateFixtures(data.players),[data.players]);
  const gp=useCallback(id=>data.players.find(p=>p.id===id),[data.players]);

  // Celebrate when the final league match is played (fires once, for every viewer).
  useEffect(()=>{
    if(leagueDoneRef.current===null)return;
    const total=fixtures.length,played=Object.keys(data.results).length;
    const done=total>0&&played>=total;
    if(done&&leagueDoneRef.current===false)fireConfetti();
    leagueDoneRef.current=done;
  },[data.results,fixtures.length]);

  if(loading)return<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:18}}><span style={{fontSize:56,animation:"pulse 1.2s infinite"}}>🎱</span><div className="skel" style={{width:120,height:8,borderRadius:4}}/></div>;

  if(!ready||!gistId)return<Setup onReady={(id,tok)=>{setGistId(id);setToken(tok);if(tok)localStorage.setItem(TOKEN_KEY,tok);setReady(true)}}/>;

  const tabs=[{id:"home",i:"🏠",l:"Home"},{id:"table",i:"🏆",l:"Table"},{id:"fixtures",i:"📋",l:"Fixtures"},
    ...(data.playoffs?.enabled?[{id:"bracket",i:"🥊",l:"Playoffs"}]:[]),{id:"stats",i:"📊",l:"Stats"},
    ...(isAdmin?[{id:"admin",i:"⚙️",l:"Admin"}]:[])];

  return<VideoCtx.Provider value={setIntro}><div>
    <div style={{padding:"20px 20px 14px",background:"linear-gradient(180deg,rgba(251,191,36,0.1) 0%,transparent 100%)",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:40,backdropFilter:"blur(12px)"}}>
      {data.logo?<img src={data.logo} alt="" style={{width:40,height:40,objectFit:"contain",flexShrink:0}}/>:<span style={{fontSize:34}}>🎱</span>}<h1 style={{fontSize:28,fontWeight:400,color:"#FBBF24",fontFamily:"var(--hd)",letterSpacing:1.5,flex:1,lineHeight:1.05,textShadow:"0 2px 12px rgba(251,191,36,0.25)"}}>{data.tournamentName}</h1>
      <button className="press" onClick={toggleSound} title={sound?"Sound on":"Sound off"} style={{background:"rgba(255,255,255,0.06)",border:"none",borderRadius:12,width:44,height:44,fontSize:20,cursor:"pointer",color:sound?"#FBBF24":"#475569",flexShrink:0}}>{sound?"🔊":"🔇"}</button></div>

    <StatusBar lastSync={lastSync} saving={saving} isAdmin={isAdmin}/>

    {toast&&<div onClick={()=>setToast(null)} style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:200,background:"linear-gradient(135deg,#22C55E,#16A34A)",color:"#06210F",fontWeight:800,fontSize:15,padding:"13px 22px",borderRadius:16,boxShadow:"0 10px 30px rgba(0,0,0,0.5)",maxWidth:"90%",fontFamily:"var(--bd)",animation:"slideUp 0.3s",cursor:"pointer"}}>{toast}</div>}

    <div key={tab} style={{padding:"20px 16px 100px",fontFamily:"var(--bd)",animation:"fadeSlide .34s cubic-bezier(.22,1,.36,1)"}}>
      {tab==="home"&&<Home data={data} players={data.players} results={data.results} fixtures={fixtures} gp={gp} onNav={setTab} onTap={setPp}/>}
      {tab==="table"&&<TableScreen players={data.players} results={data.results} onTap={setPp} data={data}/>}
      {tab==="fixtures"&&<FixturesScreen data={data} players={data.players} results={data.results} fixtures={fixtures} gp={gp} onTap={setPp}/>}
      {tab==="bracket"&&<BracketScreen data={data} gp={gp} onTap={setPp}/>}
      {tab==="stats"&&<StatsScreen players={data.players} results={data.results} onTap={setPp}/>}
      {tab==="admin"&&<AdminScreen data={data} save={saveData} isAdmin={isAdmin} gistId={gistId} onResult={setReveal}/>}</div>

    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(8,13,25,0.92)",backdropFilter:"blur(18px)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",justifyContent:"center",zIndex:50,maxWidth:680,margin:"0 auto",paddingBottom:"env(safe-area-inset-bottom,8px)"}}>
      <div style={{position:"absolute",top:0,height:3,width:`${100/tabs.length}%`,left:`${Math.max(0,tabs.findIndex(t=>t.id===tab))*100/tabs.length}%`,background:"#FBBF24",borderRadius:"0 0 3px 3px",transition:"left .32s cubic-bezier(.22,1,.36,1)",boxShadow:"0 0 12px #FBBF24"}}/>
      {tabs.map(t=>{const on=tab===t.id;return<button key={t.id} onClick={()=>{navigator.vibrate?.(8);setTab(t.id)}} style={{flex:1,padding:"10px 0 12px",border:"none",background:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:on?"#FBBF24":"#475569",minHeight:60,transition:"color 0.25s"}}>
        <span style={{fontSize:23,filter:on?"drop-shadow(0 0 8px rgba(251,191,36,0.6))":"none",transform:on?"scale(1.14) translateY(-1px)":"scale(1)",transition:"transform 0.28s cubic-bezier(.34,1.56,.64,1)"}}>{t.i}</span><span style={{fontSize:11,fontWeight:700,fontFamily:"var(--bd)",letterSpacing:.5}}>{t.l}</span></button>;})}</div>

    {pp&&<Profile player={pp} players={data.players} results={data.results} fixtures={fixtures} onClose={()=>setPp(null)} gp={gp} data={data} onTap={setPp}/>}
    {reveal&&<ResultReveal reveal={reveal} onClose={()=>setReveal(null)}/>}
    {intro&&<VideoModal src={intro.video} poster={intro.image} name={intro.name} onClose={()=>setIntro(null)}/>}
  </div></VideoCtx.Provider>;
}

const C={background:"linear-gradient(180deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02))",borderRadius:20,padding:"18px 20px",border:"1px solid rgba(255,255,255,0.08)",boxShadow:"0 8px 30px rgba(0,0,0,0.35)",backdropFilter:"blur(6px)"};
const HS={fontSize:26,fontWeight:400,color:"#F8FAFC",fontFamily:"var(--hd)",letterSpacing:2,marginBottom:16};
const inp={background:"rgba(8,13,25,0.8)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"12px 16px",color:"#F8FAFC",fontSize:16,fontFamily:"var(--bd)"};
const btnS={background:"rgba(255,255,255,0.07)",border:"none",borderRadius:12,padding:"10px 14px",color:"#94A3B8",fontSize:15,cursor:"pointer",fontFamily:"var(--bd)"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
